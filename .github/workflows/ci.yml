name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:

# Only the latest run per ref matters; cancel superseded ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      # Unit + Testcontainers integration (ADR-0011); the runner's Docker daemon
      # backs Testcontainers. ArchUnit fitness functions run as part of check.
      # Invoked from the repo root: the Gradle wrapper lives there (multi-module
      # build, ADR-0056), with the backend as the :backend subproject.
      - name: Build and test
        run: ./gradlew --no-daemon --build-cache :backend:check

  frontend:
    name: Frontend (contract + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      # Regenerate typed API from the canonical OpenAPI contract (ADR-0008);
      # a malformed spec fails here, and the generated types are typechecked below.
      - name: Generate API types
        working-directory: frontend
        run: npm run gen:api
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Verifies the multi-stage Dockerfiles build (ADR-0004); does not start the stack.
      - name: Build images
        run: docker compose build
      # Combined image (ADR-0059) isn't part of docker-compose.yml (a separate
      # deployment option, not the local-dev stack) so it's verified on its own.
      - name: Build combined image
        run: docker build -f deploy/combined/Dockerfile -t campaign-organizer:ci .

  publish:
    name: Publish images to private registry
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    # Every push to master keeps `latest` (+ commit SHA) current; a `vX.Y.Z`
    # release tag additionally publishes immutable semver-tagged images
    # (ADR-0057). Nothing else (PRs, other branches) reaches this job.
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Joins the tailnet for this job only, as an ephemeral node tagged
      # tag:ci (ADR-0057); the registry is reachable only from the tailnet.
      - name: Connect to tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
      # The registry sits behind Caddy's self-signed internal CA (ADR-0058),
      # so Docker won't trust it by default. certs.d is per-registry and
      # needs no daemon restart; the "docker" buildx driver delegates to the
      # host daemon (unlike the container-based driver) so it honors certs.d
      # too.
      - name: Trust registry CA certificate
        run: |
          sudo mkdir -p "/etc/docker/certs.d/${{ vars.REGISTRY_HOST }}"
          printf '%s\n' "${{ secrets.REGISTRY_CA_CERT }}" | \
            sudo tee "/etc/docker/certs.d/${{ vars.REGISTRY_HOST }}/ca.crt" > /dev/null
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      # latest/sha tags on every master push; vX.Y.Z/vX.Y/vX only on a
      # matching release tag push (is_default_branch is false for tag refs).
      - name: Backend image tags
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.REGISTRY_HOST }}/campaign-organizer-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
      - name: Frontend image tags
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.REGISTRY_HOST }}/campaign-organizer-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
      # Combined image (ADR-0059): backend + statically-served frontend in one
      # container, an alternative to the split backend/frontend pair above.
      - name: Combined image tags
        id: meta-combined
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.REGISTRY_HOST }}/campaign-organizer
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
      - name: Build and push combined image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/combined/Dockerfile
          push: true
          tags: ${{ steps.meta-combined.outputs.tags }}
          labels: ${{ steps.meta-combined.outputs.labels }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    # Only a `vX.Y.Z` tag push cuts a release (ADR-0060); a plain master push
    # never reaches this job.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create release with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
