name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Only the latest run per ref matters; cancel superseded ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      # Unit + Testcontainers integration (ADR-0011); the runner's Docker daemon
      # backs Testcontainers. ArchUnit fitness functions run as part of check.
      # Invoked from the repo root: the Gradle wrapper lives there (multi-module
      # build, ADR-0056), with the backend as the :backend subproject.
      - name: Build and test
        run: ./gradlew --no-daemon --build-cache :backend:check

  frontend:
    name: Frontend (contract + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      # Regenerate typed API from the canonical OpenAPI contract (ADR-0008);
      # a malformed spec fails here, and the generated types are typechecked below.
      - name: Generate API types
        working-directory: frontend
        run: npm run gen:api
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Verifies the multi-stage Dockerfiles build (ADR-0004); does not start the stack.
      - name: Build images
        run: docker compose build
