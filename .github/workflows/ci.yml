name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Only the latest run per ref matters; cancel superseded ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      # Unit + Testcontainers integration (ADR-0011); the runner's Docker daemon
      # backs Testcontainers. ArchUnit fitness functions run as part of check.
      # Invoked from the repo root: the Gradle wrapper lives there (multi-module
      # build, ADR-0056), with the backend as the :backend subproject.
      - name: Build and test
        run: ./gradlew --no-daemon --build-cache :backend:check

  frontend:
    name: Frontend (contract + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      # Regenerate typed API from the canonical OpenAPI contract (ADR-0008);
      # a malformed spec fails here, and the generated types are typechecked below.
      - name: Generate API types
        working-directory: frontend
        run: npm run gen:api
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Verifies the multi-stage Dockerfiles build (ADR-0004); does not start the stack.
      - name: Build images
        run: docker compose build

  publish:
    name: Publish images to private registry
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Joins the tailnet for this job only, as an ephemeral node tagged
      # tag:ci (ADR-0057); the registry is reachable only from the tailnet.
      - name: Connect to tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
      - uses: docker/setup-buildx-action@v4
      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ vars.REGISTRY_HOST }}/campaign-organizer-backend:latest
            ${{ vars.REGISTRY_HOST }}/campaign-organizer-backend:${{ github.sha }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: |
            ${{ vars.REGISTRY_HOST }}/campaign-organizer-frontend:latest
            ${{ vars.REGISTRY_HOST }}/campaign-organizer-frontend:${{ github.sha }}
