spring:
  application:
    name: campaign-organizer
  datasource:
    # ADR-0114: this is app_runtime (ordinary, non-superuser) — never the
    # migrations-only superuser below. Getting these two swapped means every
    # RLS policy silently does nothing.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campaign_organizer}
    username: ${SPRING_DATASOURCE_USERNAME:app_runtime}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme-runtime}
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    # Deliberately separate from spring.datasource.* (ADR-0114): Flyway needs
    # the migrations-only superuser (app) to create tables/roles/policies —
    # app_runtime, above, owns nothing and couldn't run these migrations.
    url: ${SPRING_FLYWAY_URL:jdbc:postgresql://localhost:5432/campaign_organizer}
    user: ${SPRING_FLYWAY_USER:app}
    password: ${SPRING_FLYWAY_PASSWORD:changeme}

server:
  port: 8080
  # nginx always sits in front of this app (root/combined docker-compose) and
  # forwards X-Forwarded-Proto/Host, but the backend<->nginx hop itself is
  # plain HTTP — without this, Spring builds absolute URLs (notably OAuth2's
  # {baseUrl} redirect-uri expansion) from that internal http:// connection
  # instead of the public https:// origin, which Google's OAuth client then
  # rejects as a redirect_uri_mismatch since it never matches what's
  # registered in the Google Cloud Console.
  forward-headers-strategy: framework
  error:
    include-message: always

# Explicit even though these match Boot's own defaults: only /actuator/health
# is reachable over HTTP, and it never returns component details (DB URL,
# disk paths, etc.) to a caller — this is a public, unauthenticated path
# (see SecurityConfig.PUBLIC_API_PATHS) for container/orchestrator liveness
# checks, so nothing beyond a bare UP/DOWN status may ever be exposed there.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  # Per-account authentication (see docs/adr/0110-self-registration-and-role-based-jwt.md).
  jwt:
    # HS256 secret; must be >= 32 bytes. Override in production.
    secret: ${APP_JWT_SECRET:dev-secret-change-me-please-32-bytes-minimum}
    # A leaked-but-not-yet-revoked token's blast radius is bounded by this;
    # explicit revocation (disable/role change/password reset/logout-all)
    # takes effect immediately regardless, via the account's token_version.
    expiration-hours: ${APP_JWT_EXPIRATION_HOURS:24}
  # TOTP secret encryption at rest (see docs/adr/0111-mandatory-mfa.md). Both values feed
  # Spring Security Crypto's Encryptors.delux(key, salt) — override both in production; the
  # salt isn't secret but must stay fixed (changing it makes every already-encrypted secret
  # undecryptable, forcing every TOTP-enrolled account to re-enroll).
  mfa:
    encryption-key: ${APP_MFA_ENCRYPTION_KEY:dev-mfa-key-change-me-in-production}
    encryption-salt: ${APP_MFA_ENCRYPTION_SALT:a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4}
  # Foundry VTT push integration (see docs/adr/0115-push-to-foundry-vtt.md). This is
  # ONLY the key/salt for encrypting whatever relay API key a user enters for their
  # own world — there is no relay URL, clientId, or API key configured here or
  # anywhere at the env/deploy level. Every world's Foundry connection is entirely
  # user-supplied (bring-your-own, self-hosted relay); nothing here implies a
  # shared or default relay.
  foundry:
    encryption-key: ${APP_FOUNDRY_ENCRYPTION_KEY:dev-foundry-key-change-me-in-production}
    encryption-salt: ${APP_FOUNDRY_ENCRYPTION_SALT:b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5}
  # WebAuthn/passkeys (see docs/adr/0111-mandatory-mfa.md). relying-party-id must be a
  # registrable domain suffix of the browser's actual hostname (bare host, no scheme/port);
  # allowed-origins must match the browser's origin *exactly* (scheme + host + port). Both
  # MUST be overridden for any real deployment — the defaults only work for this app's own
  # docker-compose frontend on localhost.
  webauthn:
    relying-party-id: ${APP_WEBAUTHN_RP_ID:localhost}
    relying-party-name: ${APP_WEBAUTHN_RP_NAME:Campaign Organizer}
    allowed-origins: ${APP_WEBAUTHN_ALLOWED_ORIGINS:http://localhost:3001}
  # Google sign-in (see docs/adr/0113-sso-oidc-login.md). Blank (the default): SecurityConfig
  # never registers the .oauth2Login() DSL, and its clientRegistrationRepository bean is empty —
  # no /oauth2/authorization/google, no dependency on real credentials to start the app.
  # Deliberately NOT spring.security.oauth2.client.registration.*: Spring Boot's own
  # OAuth2ClientProperties validates every registered client eagerly at bean-creation time
  # (throws "Client id ... must not be empty" even when nothing ever calls .oauth2Login()), which
  # would break every other request in this app whenever Google isn't configured. Building the
  # ClientRegistration by hand in SecurityConfig, only when actually enabled, avoids that
  # entirely — see SecurityConfig.clientRegistrationRepository.
  oidc:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
  media:
    # Local-volume media storage (see docs/adr/0007-local-media-storage.md).
    dir: ${APP_MEDIA_DIR:./data/media}
  backup:
    # Nightly snapshot schedule (see docs/adr/0073-scheduled-backups.md):
    # Spring cron "sec min hour dom mon dow", default 03:37 UTC. Snapshots
    # land in {app.media.dir}/backups; keep controls how many survive.
    cron: ${APP_BACKUP_CRON:0 37 3 * * *}
    keep: ${APP_BACKUP_KEEP:7}
  ai:
    # AI-assisted drafting (see docs/adr/0064-ai-text-drafting.md). Both are
    # optional and free-tier; blank means that provider is skipped. Model
    # choice and priority are user-editable settings, not env config -
    # see docs/adr/0065-ai-provider-settings.md.
    groq-api-key: ${GROQ_API_KEY:}
    open-router-api-key: ${OPENROUTER_API_KEY:}
    # Override to point a provider at a proxy or any OpenAI-compatible endpoint.
    groq-base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    open-router-base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.flywaydb: info
