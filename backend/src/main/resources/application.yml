spring:
  application:
    name: campaign-organizer
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campaign_organizer}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080
  error:
    include-message: always

app:
  # Single-password authentication (see docs/adr/0006-single-password-auth.md).
  password: ${APP_PASSWORD:changeme}
  jwt:
    # HS256 secret; must be >= 32 bytes. Override in production.
    secret: ${APP_JWT_SECRET:dev-secret-change-me-please-32-bytes-minimum}
    expiration-hours: ${APP_JWT_EXPIRATION_HOURS:720}
  media:
    # Local-volume media storage (see docs/adr/0007-local-media-storage.md).
    dir: ${APP_MEDIA_DIR:./data/media}
  ai:
    # AI-assisted drafting (see docs/adr/0064-ai-text-drafting.md). Both are
    # optional and free-tier; blank means that provider is skipped. Model
    # choice and priority are user-editable settings, not env config -
    # see docs/adr/0065-ai-provider-settings.md.
    groq-api-key: ${GROQ_API_KEY:}
    open-router-api-key: ${OPENROUTER_API_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.flywaydb: info
