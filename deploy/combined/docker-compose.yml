# Deploys the combined image (ADR-0059): one app container instead of the
# separate frontend/backend pair in the root docker-compose.yml. Requires
# `docker login <REGISTRY_HOST>` first if the registry needs auth.
# Copy .env.example to .env and adjust before running `docker compose up`.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campaign_organizer
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d campaign_organizer"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${REGISTRY_HOST}/campaign-organizer:${IMAGE_TAG:-latest}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/campaign_organizer
      # ADR-0114: app_runtime is the app's own ordinary (non-superuser) role;
      # Flyway below still uses the db service's real superuser (app) to run
      # migrations and provision app_runtime in the first place.
      SPRING_DATASOURCE_USERNAME: app_runtime
      SPRING_DATASOURCE_PASSWORD: ${RUNTIME_DB_PASSWORD:-changeme-runtime}
      SPRING_FLYWAY_URL: jdbc:postgresql://db:5432/campaign_organizer
      SPRING_FLYWAY_USER: app
      SPRING_FLYWAY_PASSWORD: ${DB_PASSWORD:-changeme}
      APP_PASSWORD: ${APP_PASSWORD:-changeme}
      APP_JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please-32-bytes-minimum}
      APP_MEDIA_DIR: /data/media
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - media-data:/data/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  db-data:
  media-data:
