# Private Docker registry. Only bound to localhost: exposing it beyond that
# is left to your own reverse proxy / network setup. See README.md.
services:
  registry:
    image: registry:2
    restart: unless-stopped
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registry Realm
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    volumes:
      - registry-data:/var/lib/registry
      # Not :ro - the registry's htpasswd auth handler needs non-read-only
      # access to this path, not just a one-time read (panics with "read-only
      # file system" otherwise).
      - ./auth:/auth
    ports:
      - "127.0.0.1:5000:5000"

volumes:
  registry-data:
