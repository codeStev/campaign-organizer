# Private Docker registry, run on a tailnet node (e.g. the deploy server itself).
# Only bound to localhost: reachability from the rest of the tailnet comes from
# Caddy (already configured separately, ADR-0058) proxying HTTPS to this
# container, not from a published port on the host's real network interfaces.
# See README.md in this directory.
services:
  registry:
    image: registry:2
    restart: unless-stopped
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registry Realm
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    volumes:
      - registry-data:/var/lib/registry
      - ./auth:/auth:ro
    ports:
      - "127.0.0.1:5000:5000"

volumes:
  registry-data:
