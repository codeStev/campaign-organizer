# Full local stack: Postgres + Spring Boot backend + nginx-served React frontend.
# Media is stored on a local volume (no object store) per ADR-0007.
# Copy .env.example to .env and adjust before running `docker compose up`.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campaign_organizer
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d campaign_organizer"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/campaign_organizer
      # ADR-0114: app_runtime is the app's own ordinary (non-superuser) role;
      # Flyway below still uses the db service's real superuser (app) to run
      # migrations and provision app_runtime in the first place.
      SPRING_DATASOURCE_USERNAME: app_runtime
      SPRING_DATASOURCE_PASSWORD: ${RUNTIME_DB_PASSWORD:-changeme-runtime}
      SPRING_FLYWAY_URL: jdbc:postgresql://db:5432/campaign_organizer
      SPRING_FLYWAY_USER: app
      SPRING_FLYWAY_PASSWORD: ${DB_PASSWORD:-changeme}
      APP_JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please-32-bytes-minimum}
      APP_MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-dev-mfa-key-change-me-in-production}
      APP_MFA_ENCRYPTION_SALT: ${MFA_ENCRYPTION_SALT:-a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4}
      APP_FOUNDRY_ENCRYPTION_KEY: ${FOUNDRY_ENCRYPTION_KEY:-dev-foundry-key-change-me-in-production}
      APP_FOUNDRY_ENCRYPTION_SALT: ${FOUNDRY_ENCRYPTION_SALT:-b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5}
      APP_WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      APP_WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Campaign Organizer}
      APP_WEBAUTHN_ALLOWED_ORIGINS: ${WEBAUTHN_ALLOWED_ORIGINS:-http://localhost:3001}
      APP_MEDIA_DIR: /data/media
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APP_BACKUP_CRON: ${APP_BACKUP_CRON:-0 37 3 * * *}
      APP_BACKUP_KEEP: ${APP_BACKUP_KEEP:-7}
    volumes:
      - media-data:/data/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db-data:
  media-data:
