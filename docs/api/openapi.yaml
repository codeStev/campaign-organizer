        imageUrl:
          type: [string, "null"]
        pins:
          type: array
          items:
            $ref: '#/components/schemas/PacketPin'

    SessionPacket:
      type: object
      required: [session, campaignName, beats, articles, maps, statblocks, rollTables, cardDecks]
