        maxResult:
          type: [integer, "null"]
          description: Inclusive upper bound of the covered result range; null = unbounded above.
        body:
          type: string
          description: Outcome text as Markdown; supports [[wiki-links]] (ADR-0014).
        nestedTableIds:
          type: array
          items:
            type: string
            format: uuid
          description: Roll tables chained after this row resolves (FR-41); each must exist in this world.
        nestedDeckIds:
          type: array
          items:
            type: string
            format: uuid
          description: Card decks chained after this row resolves (FR-41); each must exist in this world.

    RollTableEntry:
      type: object
      required: [id, body]
      properties:
        id:
          type: string
          format: uuid
        minResult:
          type: [integer, "null"]
        maxResult:
          type: [integer, "null"]
        body:
          type: string
        nestedTableIds:
          type: array
          items:
            type: string
            format: uuid
        nestedDeckIds:
          type: array
          items:
            type: string
            format: uuid

