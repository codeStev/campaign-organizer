          description: Field values keyed by the template's field keys.

    CharacterSheet:
      type: object
      required: [id, worldId, templateId, name, values, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
        articleId:
          type: [string, "null"]
          format: uuid
        campaignId:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        values:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

