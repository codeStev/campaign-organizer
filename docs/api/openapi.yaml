          enum: [FREEFORM, STATBLOCK, TABLE_ROW, DECK_CARD]
        text:
          type: [string, "null"]
          description: Freeform Markdown; required for FREEFORM.
        statblockId:
          type: [string, "null"]
          format: uuid
          description: Required for STATBLOCK.
        tableId:
          type: [string, "null"]
          format: uuid
        entryId:
          type: [string, "null"]
          format: uuid
          description: Required for TABLE_ROW (with tableId).
        deckId:
          type: [string, "null"]
          format: uuid
        cardId:
          type: [string, "null"]
          format: uuid
          description: Required for DECK_CARD (with deckId).

    CheatSheetRequest:
      type: object
      required: [fragments]
      properties:
        fragments:
          type: array
          items:
            $ref: '#/components/schemas/CheatSheetFragmentInput'

    CheatSheetFragment:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [FREEFORM, STATBLOCK, TABLE_ROW, DECK_CARD]
        text:
          type: [string, "null"]
        statblockId:
          type: [string, "null"]
          format: uuid
        tableId:
          type: [string, "null"]
          format: uuid
        entryId:
          type: [string, "null"]
          format: uuid
        deckId:
          type: [string, "null"]
          format: uuid
        cardId:
          type: [string, "null"]
          format: uuid

    CheatSheet:
      type: object
      required: [id, sessionId, fragments, createdAt, updatedAt]
      properties:
