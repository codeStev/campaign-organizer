        system:
          type: [string, "null"]
          maxLength: 100
        sections:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSection'

    FieldTemplate:
      type: object
      required: [id, worldId, name, kind, sections, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/TemplateKind'
        system:
          type: [string, "null"]
        sections:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSection'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BuiltinFieldTemplate:
      type: object
      required: [name, kind, sections]
      properties:
        name:
          type: string
        kind:
          $ref: '#/components/schemas/TemplateKind'
        system:
          type: [string, "null"]
        sections:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSection'

