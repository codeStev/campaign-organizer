    PacketRollTable:
      type: object
      required: [id, title, diceExpression, minResult, maxResult, entries]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        diceExpression:
          type: string
        minResult:
          type: integer
        maxResult:
          type: integer
        entries:
          type: array
          items:
            $ref: '#/components/schemas/PacketRollTableEntry'

    PacketDeckCard:
      type: object
      required: [title, bodyHtml]
      properties:
        title:
          type: [string, "null"]
        bodyHtml:
          type: [string, "null"]

    PacketCardDeck:
      type: object
      required: [id, title, cards]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        cards:
          type: array
          items:
            $ref: '#/components/schemas/PacketDeckCard'

    LoginRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          description: The configured application password.
          examples: ["changeme"]

    TokenResponse:
      type: object
      required: [token, tokenType, expiresAt]
      properties:
        token:
          type: string
          description: "Signed JWT to send as `Authorization: Bearer <token>`."
        tokenType:
          type: string
          const: Bearer
        expiresAt:
          type: string
          format: date-time
          description: Expiry instant of the token (UTC).

    WorldRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          examples: ["Aethelgard"]
        description:
          type: string
          maxLength: 5000
          description: Optional summary of the world.

    World:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        layerStyles:
          $ref: '#/components/schemas/LayerStyleMap'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LayerStyle:
      type: object
      description: Styling for a map layer.
      properties:
        color:
          type: [string, "null"]
        icon:
          type: [string, "null"]

    LayerStyleMap:
      type: object
      description: Per-layer styling keyed by layer name.
      additionalProperties:
        $ref: '#/components/schemas/LayerStyle'

    CategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        parentId:
          type: [string, "null"]
          format: uuid
          description: Parent category for nesting, or null for a root category.

    Category:
      type: object
      required: [id, worldId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        parentId:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ArticleTemplate:
      type: string
      description: The kind of article; drives structured prompts later.
      enum: [GENERIC, CHARACTER, LOCATION, ORGANIZATION, SPECIES, ITEM, EVENT]

    ArticleTemplateSection:
      type: object
      required: [heading, hint]
      properties:
        heading:
          type: string
        hint:
          type: string

    ArticleTemplateInfo:
      type: object
      required: [template, label, sections]
      properties:
        template:
          $ref: '#/components/schemas/ArticleTemplate'
        label:
          type: string
        sections:
          type: array
          items:
            $ref: '#/components/schemas/ArticleTemplateSection'

    ArticleRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          maxLength: 220
          description: >
            Optional URL-safe identifier, unique per world. Generated from the
            title (and de-duplicated) when omitted.
        template:
          $ref: '#/components/schemas/ArticleTemplate'
        categoryId:
          type: [string, "null"]
          format: uuid
        body:
          type: string
          description: Article body as Markdown (see ADR-0054).

    ArticleSummary:
      type: object
      required: [id, worldId, title, slug, template, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        categoryId:
          type: [string, "null"]
          format: uuid
        title:
          type: string
        slug:
          type: string
        template:
          $ref: '#/components/schemas/ArticleTemplate'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Article:
      allOf:
        - $ref: '#/components/schemas/ArticleSummary'
        - type: object
          required: [body]
          properties:
            body:
              type: [string, "null"]
              description: >
                Raw article body as Markdown, including `[[target]]`
                wiki-links (see ADR-0054).
            bodyHtml:
              type: [string, "null"]
              readOnly: true
              description: >
                Rendered body: Markdown converted to HTML (see ADR-0054),
                then wiki-links resolved to anchors (see ADR-0014).
                Read-only; derived from `body`.

    Usage:
      type: object
      required: [type, label]
      properties:
        type:
          type: string
          enum: [BEAT, MAP_PIN, TIMELINE_EVENT, RELATIONSHIP, CHARACTER_SHEET, STATBLOCK, ARTICLE_LINK, ROLL_TABLE, CARD_DECK]
        label:
          type: string
        targetId:
          type: [string, "null"]
          format: uuid
          description: An article the client can open (RELATIONSHIP, ARTICLE_LINK); else null.
        campaignId:
          type: [string, "null"]
          format: uuid
        campaignName:
          type: [string, "null"]

    UsageResponse:
      type: object
      required: [usages]
      properties:
        usages:
          type: array
          items:
            $ref: '#/components/schemas/Usage'

    ConsistencyReport:
      type: object
      required: [brokenLinks, orphanedArticles, unreferencedByCampaigns]
      properties:
        brokenLinks:
          type: array
          items:
            $ref: '#/components/schemas/BrokenLink'
        orphanedArticles:
          type: array
          description: Articles no article body, beat, roll-table entry or deck card links or references.
          items:
            $ref: '#/components/schemas/ConsistencyArticle'
        unreferencedByCampaigns:
          type: array
          description: Articles no campaign references via beats, sheets or statblocks.
          items:
            $ref: '#/components/schemas/ConsistencyArticle'

    BrokenLink:
      type: object
      required: [sourceType, sourceId, sourceLabel, target]
      properties:
        sourceType:
          type: string
          enum: [ARTICLE, BEAT, ROLL_TABLE, CARD_DECK]
        sourceId:
          type: string
          format: uuid
        sourceLabel:
          type: string
        target:
          type: string
          description: The unresolved (lowercased) [[link]] target as written.

    ConsistencyArticle:
      type: object
      required: [articleId, title]
      properties:
        articleId:
          type: string
          format: uuid
        title:
          type: string

    ArticleRevision:
      type: object
      required: [id, articleId, title, slug, template, createdAt]
      properties:
        id:
          type: string
          format: uuid
        articleId:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        template:
          $ref: '#/components/schemas/ArticleTemplate'
        body:
          type: [string, "null"]
          description: Snapshotted article body as Markdown (see ADR-0054).
        createdAt:
          type: string
          format: date-time

    RelationshipRequest:
      type: object
      required: [fromArticleId, toArticleId]
      properties:
        fromArticleId:
          type: string
          format: uuid
        toArticleId:
          type: string
          format: uuid
        label:
          type: [string, "null"]
          maxLength: 100
          description: Free-text relationship, e.g. "parent of", "allied with".
        directed:
          type: boolean
          default: true
          description: When true, the link has a direction from -> to.

    Relationship:
      type: object
      required: [id, worldId, fromArticleId, toArticleId, directed, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        fromArticleId:
          type: string
          format: uuid
        toArticleId:
          type: string
          format: uuid
        label:
          type: [string, "null"]
        directed:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CalendarMonthInput:
      type: object
      required: [name, days]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        days:
          type: integer
          minimum: 1

    CalendarMonth:
      type: object
      required: [name, days]
      properties:
        name:
          type: string
        days:
          type: integer

    CalendarRequest:
      type: object
      required: [name, months]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        daysPerWeek:
          type: [integer, "null"]
          minimum: 1
        months:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CalendarMonthInput'

    Calendar:
      type: object
      required: [id, worldId, name, months, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        name:
          type: string
        daysPerWeek:
          type: [integer, "null"]
        months:
          type: array
          items:
            $ref: '#/components/schemas/CalendarMonth'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TimelineRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 5000
        calendarId:
          type: [string, "null"]
          format: uuid
          description: Optional calendar used to render and validate event dates.

    Timeline:
      type: object
      required: [id, worldId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        calendarId:
          type: [string, "null"]
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TimelineEventRequest:
      type: object
      required: [title, year]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 5000
        articleId:
          type: [string, "null"]
          format: uuid
        year:
          type: integer
          description: Integer year; negative values denote pre-epoch dates.
        month:
          type: [integer, "null"]
          minimum: 1
        day:
          type: [integer, "null"]
          minimum: 1

    TimelineEvent:
      type: object
      required: [id, timelineId, title, year, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        timelineId:
          type: string
          format: uuid
        articleId:
          type: [string, "null"]
          format: uuid
        title:
          type: string
        description:
          type: [string, "null"]
        year:
          type: integer
        month:
          type: [integer, "null"]
        day:
          type: [integer, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MapRequest:
      type: object
      required: [name, mediaId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        mediaId:
          type: string
          format: uuid
          description: The uploaded image used as the map's base layer.

    Map:
      type: object
      required: [id, worldId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        name:
          type: string
        mediaId:
          type: [string, "null"]
          format: uuid
        imageUrl:
          type: [string, "null"]
          description: Public URL of the base image (null if the image was deleted).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MapPinRequest:
      type: object
      required: [x, y]
      properties:
        articleId:
          type: [string, "null"]
          format: uuid
        label:
          type: [string, "null"]
          maxLength: 200
        layer:
          type: [string, "null"]
          maxLength: 100
          description: Optional group used for toggling visibility.
        x:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Horizontal position as a fraction of image width.
        y:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Vertical position as a fraction of image height.

    MapPin:
      type: object
      required: [id, mapId, x, y, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        mapId:
          type: string
          format: uuid
        articleId:
          type: [string, "null"]
          format: uuid
        label:
          type: [string, "null"]
        layer:
          type: [string, "null"]
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MediaAsset:
      type: object
      required: [id, worldId, filename, contentType, size, url, createdAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        filename:
          type: string
        contentType:
          type: string
        size:
          type: integer
          format: int64
        url:
          type: string
          description: Public URL serving the bytes.
        createdAt:
          type: string
          format: date-time

    ProblemDetail:
      type: object
      description: RFC 9457 / RFC 7807 problem response.
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

security:
  - bearerAuth: []
