    get:
      tags: [tags]
      summary: List a world's distinct tag names
      description: >-
        Every distinct tag name used anywhere in the world (articles and
        statblocks), for autocomplete (ADR-0083).
      operationId: listWorldTags
      responses:
        '200':
          description: Distinct tag names, alphabetical.
