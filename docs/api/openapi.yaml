        - name: categoryId
          in: query
          required: false
          description: Filter to a single category.
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: >-
            Full-text search query over title, body, and tag names
            (ADR-0087) - an article tagged "patron" matches a search for
            "patron" even with no title/body hit.
          schema:
            type: string
        - name: campaignId
          in: query
          required: false
          description: >
            Filter to articles referenced by that campaign's play content
            (beats, character sheets, statblocks). Standalone filter.
          schema:
            type: string
            format: uuid
        - name: tag
          in: query
          required: false
          description: Filter to articles carrying this tag (ADR-0083).
          schema:
            type: string
