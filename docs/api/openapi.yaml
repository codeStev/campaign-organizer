              schema:
                $ref: '#/components/schemas/TagBrowseResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/ai/draft-article-text:
    parameters:
      - $ref: '#/components/parameters/WorldId'
    post:
      tags: [ai]
      summary: Draft article text from a few keywords/instructions (ADR-0064)
      description: >-
        Prep-time only. Sends the instructions and the editor's current
        content to a cloud LLM (Groq, falling back to OpenRouter) and returns
        a draft the owner edits before saving/printing; nothing is persisted
        server-side. Unavailable (503) if no provider is configured or every
        configured provider fails. `level` picks how much to generate and
        `template` shapes it for the kind of article being drafted (ADR-0075);
        both default to today's behavior when omitted.
      operationId: draftArticleText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftArticleTextRequest'
      responses:
        '200':
          description: Drafted text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftArticleTextResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /worlds/{worldId}/ai/summarize-session-notes:
    parameters:
      - $ref: '#/components/parameters/WorldId'
    post:
      tags: [ai]
      summary: Summarize a session's private GM notes (ADR-0082)
      description: >-
        On-demand only. Sends the session's GM notes to a cloud LLM (Groq,
        falling back to OpenRouter) and returns a short digest for the GM to
        skim before their next session; nothing is persisted server-side.
        Unavailable (503) if no provider is configured or every configured
        provider fails.
      operationId: summarizeSessionNotes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SummarizeSessionNotesRequest'
      responses:
        '200':
          description: Summarized text.
          content:
