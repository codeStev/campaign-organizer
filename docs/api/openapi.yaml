  responses:
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Missing or invalid bearer token / password.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: The requested resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ServiceUnavailable:
      description: >-
        An external dependency (e.g. every configured LLM provider) is
        unavailable; retryable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    DraftArticleTextRequest:
      type: object
      required: [instructions]
      properties:
        instructions:
          type: string
          minLength: 1
          maxLength: 2000
          description: Keywords/instructions for what to draft.
          examples: ["gruff dockmaster, hides a smuggling habit"]
        existingContent:
          type: string
          maxLength: 20000
          description: >-
            The editor's current plain-text/markdown content, sent as context
            so the draft continues rather than contradicts what's already
            written. Empty for a blank article.
        level:
          $ref: '#/components/schemas/DraftLevel'
        template:
          $ref: '#/components/schemas/ArticleTemplate'

    DraftLevel:
      type: string
      description: How much to generate, from a short teaser up to a full first draft.
      enum: [QUICK_INSPIRATION, READ_ALOUD, BASIC_INFO, FULL_DRAFT]

    SummarizeSessionNotesRequest:
      type: object
      required: [notes]
      properties:
        notes:
          type: string
          minLength: 1
          maxLength: 20000
          description: The session's private GM notes to condense into a digest.

    DraftArticleTextResult:
      type: object
      required: [text, provider]
      properties:
        text:
          type: string
          description: Drafted markdown, to insert into the editor for review.
        provider:
          type: string
          description: Which configured provider produced this draft.
          examples: ["groq", "openrouter"]

    AiProviderSetting:
      type: object
      required: [providerId, defaultModel, configured, priority]
      properties:
        providerId:
          type: string
          description: Which build-in provider this setting is for.
          examples: ["groq", "openrouter"]
        model:
          type: string
          nullable: true
          description: >-
            The model to request from this provider. Null means "use
            defaultModel".
        defaultModel:
          type: string
          description: The model used when model is null.
        configured:
          type: boolean
          description: Whether this provider has an API key set (env-only, NFR-7).
        priority:
          type: integer
          description: 0-based fallback try-order; lower is tried first.

    AiProviderTestResult:
      type: object
      required: [ok, model, latencyMs]
      properties:
        ok:
          type: boolean
          description: Whether the provider answered the test request.
        model:
          type: string
          description: The model the request asked for (persisted or default).
        latencyMs:
          type: integer
          description: Round-trip time of the test request in milliseconds.
        error:
          type: string
          nullable: true
          description: Why the test failed; null when ok is true.

    AiSettingsUpdateRequest:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          minItems: 1
          description: List order becomes the new fallback priority order.
          items:
            type: object
            required: [providerId]
            properties:
              providerId:
                type: string
                examples: ["groq", "openrouter"]
              model:
                type: string
                nullable: true
                description: Null to fall back to the provider's default model.

    DiceRollRequest:
      type: object
      required: [expression]
      properties:
        expression:
          type: string
          minLength: 1
          maxLength: 200
          examples: ["2d6+3"]

    DieRoll:
      type: object
      required: [sides, value, kept]
      properties:
        sides:
          type: integer
        value:
          type: integer
        kept:
          type: boolean
          description: False for dice dropped by keep-highest/lowest.

    DiceRollResult:
      type: object
      required: [expression, total, rolls, breakdown]
      properties:
        expression:
          type: string
        total:
          type: integer
        rolls:
          type: array
          items:
            $ref: '#/components/schemas/DieRoll'
        breakdown:
          type: string
          description: Human-readable summary, e.g. "2d6 [4, 5] + 3 = 12".

    TemplateKind:
      type: string
      enum: [CHARACTER, STATBLOCK, DOCUMENT]
      description: >
        What a field template is for — a character sheet, a monster/NPC
        statblock, or a general-purpose document (session-zero sheets and
        similar, ADR-0088). Chosen at creation; drives which picker offers
        the template.

    FieldType:
      type: string
      enum: [TEXT, TEXTAREA, NUMBER, BOOLEAN, SELECT, CIRCLES]

    TemplateField:
      type: object
      required: [key, label, type]
      properties:
        key:
          type: string
          description: Stable identifier used as the key in an instance's values.
        label:
          type: string
        type:
          $ref: '#/components/schemas/FieldType'
        options:
          type: [array, "null"]
          items:
            type: string
          description: Choices for a SELECT field.
        width:
          type: [string, "null"]
          enum: [FULL, HALF, THIRD, QUARTER, null]
          description: Column width for side-by-side layout; defaults to FULL.
        count:
          type: [integer, "null"]
          minimum: 1
          description: Number of circles for a CIRCLES field.

    TemplateSection:
      type: object
      required: [title, fields]
      properties:
        title:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/TemplateField'

    SheetCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        parentId:
          type: [string, "null"]
          format: uuid
          description: Parent sheet category for nesting, or null for a root category.

    SheetCategory:
      type: object
      required: [id, worldId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        parentId:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FieldTemplateRequest:
      type: object
      required: [name, kind]
      properties:
        categoryId:
          type: [string, "null"]
          format: uuid
          description: Sheet category (ADR-0105); null for uncategorized.
        name:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          $ref: '#/components/schemas/TemplateKind'
        systemId:
          type: [string, "null"]
          format: uuid
        sections:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSection'

    FieldTemplate:
      type: object
      required: [id, worldId, name, kind, sections, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        categoryId:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/TemplateKind'
        systemId:
          type: [string, "null"]
          format: uuid
        sections:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSection'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GlobalFieldTemplateRequest:
      type: object
      required: [name, kind, systemId]
      description: CHARACTER/STATBLOCK kinds only (ADR-0093).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          $ref: '#/components/schemas/TemplateKind'
        systemId:
          type: string
          format: uuid
          description: Required here (unlike world-scoped templates) — it's the sharing key (ADR-0094).
        sections:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSection'

    GlobalFieldTemplate:
      type: object
      required: [id, name, kind, systemId, sections, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/TemplateKind'
        systemId:
          type: string
          format: uuid
        sections:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSection'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GameSystemRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        tagline:
          type: [string, "null"]
          maxLength: 200
        color:
          type: [string, "null"]
          maxLength: 20
        notes:
          type: [string, "null"]
          description: Free-text notes (Markdown) — rule references, house rules, etc. (ADR-0095).

    GameSystem:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tagline:
          type: [string, "null"]
        color:
          type: [string, "null"]
        notes:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BuiltinFieldTemplate:
      type: object
      required: [name, kind, sections]
      properties:
        name:
          type: string
        kind:
          $ref: '#/components/schemas/TemplateKind'
        system:
          type: [string, "null"]
        sections:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSection'

    WhiteboardNode:
      type: object
      required: [id, text, x, y]
      properties:
        id:
          type: string
        text:
          type: string
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        color:
          type: [string, "null"]

    WhiteboardEdge:
      type: object
      required: [id, fromNodeId, toNodeId]
      properties:
        id:
          type: string
        fromNodeId:
          type: string
        toNodeId:
          type: string
        label:
          type: [string, "null"]

    WhiteboardRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/WhiteboardNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/WhiteboardEdge'

    Whiteboard:
      type: object
      required: [id, worldId, name, nodes, edges, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        name:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/WhiteboardNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/WhiteboardEdge'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StatblockRequest:
      type: object
      required: [name]
      properties:
        categoryId:
          type: [string, "null"]
          format: uuid
          description: Sheet category (ADR-0105); null for uncategorized.
        name:
          type: string
          minLength: 1
          maxLength: 200
        articleId:
          type: [string, "null"]
          format: uuid
        campaignId:
          type: [string, "null"]
          format: uuid
          description: Optional campaign this statblock belongs to; null = shared.
        worldTemplateId:
          type: [string, "null"]
          format: uuid
          description: >
            Optional world-scoped field template (kind=STATBLOCK) driving a
            guided stats form. At most one of worldTemplateId/globalTemplateId
            may be set (ADR-0093); neither set = freeform stats.
        globalTemplateId:
          type: [string, "null"]
          format: uuid
          description: Optional global-catalog field template (kind=STATBLOCK), see worldTemplateId.
        stats:
          type: object
          additionalProperties: true
          description: Freeform key/value stats (e.g. AC, HP, speed).
        notes:
          type: [string, "null"]
          maxLength: 20000
          description: Freeform notes (Markdown, see ADR-0054).

    Statblock:
      type: object
      required: [id, worldId, name, stats, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        categoryId:
          type: [string, "null"]
          format: uuid
        articleId:
          type: [string, "null"]
          format: uuid
        campaignId:
          type: [string, "null"]
          format: uuid
        worldTemplateId:
          type: [string, "null"]
          format: uuid
        globalTemplateId:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        stats:
          type: object
          additionalProperties: true
        notes:
          type: [string, "null"]
          description: Freeform notes (Markdown, see ADR-0054).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GlobalStatblockRequest:
      type: object
      required: [name, systemId]
      description: World-independent statblock catalog, keyed by game system (ADR-0096).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        systemId:
          type: string
          format: uuid
        globalTemplateId:
          type: [string, "null"]
          format: uuid
          description: >
            Optional global field template (kind=STATBLOCK) driving a
            guided stats form; must belong to the same systemId.
        stats:
          type: object
          additionalProperties: true
          description: Freeform key/value stats (e.g. AC, HP, speed).
        notes:
          type: [string, "null"]
          maxLength: 20000
          description: Freeform notes (Markdown, see ADR-0054).

    GlobalStatblock:
      type: object
      required: [id, name, systemId, stats, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        systemId:
          type: string
          format: uuid
        globalTemplateId:
          type: [string, "null"]
          format: uuid
        stats:
          type: object
          additionalProperties: true
        notes:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ImportGlobalStatblockRequest:
      type: object
      required: [worldId, campaignId]
      description: >
        campaignId is required here (unlike Statblock's normally optional
        campaignId) — an imported statblock is always imported for a
        specific campaign (ADR-0096).
      properties:
        worldId:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Optional name override; defaults to the catalog entry's name.

    EntityTags:
      type: object
      required: [tags]
      description: Tag names are trimmed and lower-cased (ADR-0083).
      properties:
        tags:
          type: array
          items:
            type: string

    EntityTagsRequest:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100

    TagBrowseResult:
      type: object
      required: [tag, articles, statblocks]
      properties:
        tag:
          type: string
        articles:
          type: array
          items:
            $ref: '#/components/schemas/ArticleSummary'
        statblocks:
          type: array
          items:
            $ref: '#/components/schemas/Statblock'

    CharacterSheetRequest:
      type: object
      required: [name]
      description: >
        Exactly one of worldTemplateId/globalTemplateId must be set
        (ADR-0093) — a character sheet always needs a template.
      properties:
        categoryId:
          type: [string, "null"]
          format: uuid
          description: Sheet category (ADR-0105); null for uncategorized.
        name:
          type: string
          minLength: 1
          maxLength: 200
        worldTemplateId:
          type: [string, "null"]
          format: uuid
        globalTemplateId:
          type: [string, "null"]
          format: uuid
        articleId:
          type: [string, "null"]
          format: uuid
          description: Optional linked article (the character's wiki page).
        campaignId:
          type: [string, "null"]
          format: uuid
          description: Optional campaign this character belongs to; null = shared.
        values:
          type: object
          additionalProperties: true
          description: Field values keyed by the template's field keys.

    CharacterSheet:
      type: object
      required: [id, worldId, name, values, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        categoryId:
          type: [string, "null"]
          format: uuid
        worldTemplateId:
          type: [string, "null"]
          format: uuid
        globalTemplateId:
          type: [string, "null"]
          format: uuid
        articleId:
          type: [string, "null"]
          format: uuid
        campaignId:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        values:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DocumentRequest:
      type: object
      required: [name, templateId]
      properties:
        categoryId:
          type: [string, "null"]
          format: uuid
          description: Sheet category (ADR-0105); null for uncategorized.
        name:
          type: string
          minLength: 1
          maxLength: 200
        templateId:
          type: string
          format: uuid
        campaignId:
          type: [string, "null"]
          format: uuid
          description: Optional campaign this document belongs to; null = shared.
        values:
          type: object
          additionalProperties: true
          description: Field values keyed by the template's field keys.

    Document:
      type: object
      required: [id, worldId, templateId, name, values, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        categoryId:
          type: [string, "null"]
          format: uuid
        templateId:
          type: string
          format: uuid
        campaignId:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        values:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ArcStatus:
      type: string
      enum: [PLANNED, ACTIVE, COMPLETED, ABANDONED]

    ArcRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 5000
        status:
          $ref: '#/components/schemas/ArcStatus'
        position:
          type: [integer, "null"]
          description: Ordering index within the campaign.

    Arc:
      type: object
      required: [id, campaignId, title, status, position, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, "null"]
        status:
          $ref: '#/components/schemas/ArcStatus'
        position:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EncounterEntry:
      type: object
      required: [statblockId, quantity]
      description: One statblock's slot in an encounter, with how many copies (ADR-0097).
      properties:
        statblockId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 20

    EncounterRequest:
      type: object
      required: [name, entries]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: [string, "null"]
          maxLength: 20000
          description: Freeform notes (Markdown, see ADR-0054).
        entries:
          type: array
          items:
            $ref: '#/components/schemas/EncounterEntry'

    Encounter:
      type: object
      required: [id, campaignId, name, entries, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        name:
          type: string
        notes:
          type: [string, "null"]
        entries:
          type: array
          items:
            $ref: '#/components/schemas/EncounterEntry'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ClockSegment:
      type: object
