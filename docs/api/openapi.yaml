      - name: tagName
        in: path
        required: true
        description: The tag name to browse (case-insensitive).
        schema:
          type: string
    get:
      tags: [tags]
      summary: Browse everything tagged with a given tag, across entity types
      description: >-
        Cross-entity browse view (ADR-0083): every article and statblock in
        the world carrying this tag.
      operationId: browseTag
      responses:
        '200':
          description: Articles and statblocks carrying this tag.
          content:
