            format: uuid
          description: Linked roll tables.
        deckIds:
          type: array
          items:
            type: string
            format: uuid
          description: Linked card decks.
        sessionId:
          type: [string, "null"]
          format: uuid
          description: Optional session where this beat occurred.
        position:
          type: [integer, "null"]

    Beat:
      type: object
      required: [id, arcId, title, done, articleIds, statblockIds, tableIds, deckIds, position, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        arcId:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: [string, "null"]
          description: Beat notes (Markdown, see ADR-0054).
        done:
          type: boolean
        articleIds:
          type: array
          items:
            type: string
            format: uuid
        statblockIds:
          type: array
          items:
            type: string
            format: uuid
        tableIds:
          type: array
          items:
            type: string
            format: uuid
        deckIds:
          type: array
          items:
            type: string
            format: uuid
        sessionId:
          type: [string, "null"]
          format: uuid
        position:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CampaignRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 5000
        notes:
          type: [string, "null"]
          maxLength: 20000
          description: Free-text GM notes for the campaign (Markdown, see ADR-0054).

    Campaign:
      type: object
      required: [id, worldId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        notes:
          type: [string, "null"]
          description: Free-text GM notes for the campaign (Markdown, see ADR-0054).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SessionRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        sessionNumber:
          type: [integer, "null"]
          description: Ordering index within the campaign.
        date:
          type: [string, "null"]
          format: date
          description: Real-world date the session was played.
        summary:
          type: [string, "null"]
          maxLength: 20000
          description: Session summary (Markdown, see ADR-0054).
        notes:
          type: [string, "null"]
          maxLength: 20000
          description: Private GM notes for the session (Markdown, see ADR-0054).

    CheatSheetFragmentInput:
      type: object
      required: [type]
      properties:
        type:
