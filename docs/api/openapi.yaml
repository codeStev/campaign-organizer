components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Bearer token obtained from POST /auth/login. Signed with HS256.

  parameters:
    WorldId:
      name: worldId
      in: path
      required: true
      description: Identifier of the world.
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      description: Identifier of the category.
      schema:
        type: string
        format: uuid
    ArticleId:
      name: articleId
      in: path
      required: true
      description: Identifier of the article.
      schema:
        type: string
        format: uuid
    MediaId:
      name: mediaId
      in: path
      required: true
      description: Identifier of the media asset.
      schema:
        type: string
        format: uuid
    CalendarId:
      name: calendarId
      in: path
      required: true
      description: Identifier of the calendar.
      schema:
        type: string
        format: uuid
    RelationshipId:
      name: relationshipId
      in: path
      required: true
      description: Identifier of the relationship.
      schema:
        type: string
        format: uuid
    CampaignId:
      name: campaignId
      in: path
      required: true
      description: Identifier of the campaign.
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Identifier of the session.
      schema:
        type: string
        format: uuid
    SheetTemplateId:
      name: templateId
      in: path
      required: true
      description: Identifier of the sheet template.
      schema:
        type: string
        format: uuid
    SheetId:
      name: sheetId
      in: path
      required: true
      description: Identifier of the character sheet.
      schema:
        type: string
        format: uuid
    ArcId:
      name: arcId
      in: path
      required: true
      description: Identifier of the arc.
      schema:
        type: string
        format: uuid
    BeatId:
      name: beatId
      in: path
      required: true
      description: Identifier of the beat.
      schema:
        type: string
        format: uuid
    TimelineId:
      name: timelineId
      in: path
      required: true
      description: Identifier of the timeline.
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      description: Identifier of the event.
      schema:
        type: string
        format: uuid
    MapId:
      name: mapId
      in: path
      required: true
      description: Identifier of the map.
      schema:
        type: string
        format: uuid
    PinId:
      name: pinId
      in: path
      required: true
      description: Identifier of the pin.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Missing or invalid bearer token / password.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: The requested resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    SheetFieldType:
      type: string
      enum: [TEXT, TEXTAREA, NUMBER, BOOLEAN, SELECT]

    SheetField:
      type: object
      required: [key, label, type]
      properties:
        key:
          type: string
          description: Stable identifier used as the key in a sheet's values.
        label:
          type: string
        type:
          $ref: '#/components/schemas/SheetFieldType'
        options:
          type: [array, "null"]
          items:
            type: string
          description: Choices for a SELECT field.

    SheetSection:
      type: object
      required: [title, fields]
      properties:
        title:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SheetField'

    SheetTemplateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        system:
          type: [string, "null"]
          maxLength: 100
        sections:
          type: array
          items:
            $ref: '#/components/schemas/SheetSection'

    SheetTemplate:
      type: object
      required: [id, worldId, name, sections, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        name:
          type: string
        system:
          type: [string, "null"]
        sections:
          type: array
          items:
            $ref: '#/components/schemas/SheetSection'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BuiltinSheetTemplate:
      type: object
      required: [name, sections]
      properties:
        name:
          type: string
        system:
          type: [string, "null"]
        sections:
          type: array
          items:
            $ref: '#/components/schemas/SheetSection'

    CharacterSheetRequest:
      type: object
      required: [name, templateId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        templateId:
          type: string
          format: uuid
        articleId:
          type: [string, "null"]
          format: uuid
          description: Optional linked article (the character's wiki page).
        values:
          type: object
          additionalProperties: true
          description: Field values keyed by the template's field keys.

    CharacterSheet:
      type: object
      required: [id, worldId, templateId, name, values, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
        articleId:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        values:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ArcStatus:
      type: string
      enum: [PLANNED, ACTIVE, COMPLETED, ABANDONED]

    ArcRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 5000
        status:
          $ref: '#/components/schemas/ArcStatus'
        position:
          type: [integer, "null"]
          description: Ordering index within the campaign.

    Arc:
      type: object
      required: [id, campaignId, title, status, position, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, "null"]
        status:
          $ref: '#/components/schemas/ArcStatus'
        position:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BeatRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: [string, "null"]
          maxLength: 20000
        done:
          type: boolean
          default: false
        articleId:
          type: [string, "null"]
          format: uuid
          description: Optional linked article (NPC, location, …).
        sessionId:
          type: [string, "null"]
          format: uuid
          description: Optional session where this beat occurred.
        position:
          type: [integer, "null"]

    Beat:
      type: object
      required: [id, arcId, title, done, position, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        arcId:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: [string, "null"]
        done:
          type: boolean
        articleId:
          type: [string, "null"]
          format: uuid
        sessionId:
          type: [string, "null"]
          format: uuid
        position:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CampaignRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 5000
        notes:
          type: [string, "null"]
          maxLength: 20000
          description: Free-text GM notes for the campaign.

    Campaign:
      type: object
      required: [id, worldId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        notes:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SessionRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        sessionNumber:
          type: [integer, "null"]
          description: Ordering index within the campaign.
        date:
          type: [string, "null"]
          format: date
          description: Real-world date the session was played.
        summary:
          type: [string, "null"]
          maxLength: 20000
        notes:
          type: [string, "null"]
          maxLength: 20000
          description: Private GM notes for the session.

    Session:
      type: object
      required: [id, campaignId, title, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        title:
          type: string
        sessionNumber:
          type: [integer, "null"]
        date:
          type: [string, "null"]
          format: date
        summary:
          type: [string, "null"]
        notes:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          description: The configured application password.
          examples: ["changeme"]

    TokenResponse:
      type: object
      required: [token, tokenType, expiresAt]
      properties:
        token:
          type: string
          description: "Signed JWT to send as `Authorization: Bearer <token>`."
        tokenType:
          type: string
          const: Bearer
        expiresAt:
          type: string
          format: date-time
          description: Expiry instant of the token (UTC).

    WorldRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          examples: ["Aethelgard"]
        description:
          type: string
          maxLength: 5000
          description: Optional summary of the world.

    World:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        parentId:
          type: [string, "null"]
          format: uuid
          description: Parent category for nesting, or null for a root category.

    Category:
      type: object
      required: [id, worldId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        parentId:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ArticleTemplate:
      type: string
      description: The kind of article; drives structured prompts later.
      enum: [GENERIC, CHARACTER, LOCATION, ORGANIZATION, SPECIES, ITEM, EVENT]

    TemplateSection:
      type: object
      required: [heading, hint]
      properties:
        heading:
          type: string
        hint:
          type: string

    ArticleTemplateInfo:
      type: object
      required: [template, label, sections]
      properties:
        template:
          $ref: '#/components/schemas/ArticleTemplate'
        label:
          type: string
        sections:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSection'

    ArticleRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          maxLength: 220
          description: >
            Optional URL-safe identifier, unique per world. Generated from the
            title (and de-duplicated) when omitted.
        template:
          $ref: '#/components/schemas/ArticleTemplate'
        categoryId:
          type: [string, "null"]
          format: uuid
        body:
          type: string
          description: Article body as HTML (see ADR-0013).

    ArticleSummary:
      type: object
      required: [id, worldId, title, slug, template, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        categoryId:
          type: [string, "null"]
          format: uuid
        title:
          type: string
        slug:
          type: string
        template:
          $ref: '#/components/schemas/ArticleTemplate'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Article:
      allOf:
        - $ref: '#/components/schemas/ArticleSummary'
        - type: object
          required: [body]
          properties:
            body:
              type: [string, "null"]
              description: Raw article body as HTML, including `[[target]]` wiki-links.
            bodyHtml:
              type: [string, "null"]
              readOnly: true
              description: >
                Rendered body with wiki-links resolved to anchors (see
                ADR-0014). Read-only; derived from `body`.

    RelationshipRequest:
      type: object
      required: [fromArticleId, toArticleId]
      properties:
        fromArticleId:
          type: string
          format: uuid
        toArticleId:
          type: string
          format: uuid
        label:
          type: [string, "null"]
          maxLength: 100
          description: Free-text relationship, e.g. "parent of", "allied with".
        directed:
          type: boolean
          default: true
          description: When true, the link has a direction from -> to.

    Relationship:
      type: object
      required: [id, worldId, fromArticleId, toArticleId, directed, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        fromArticleId:
          type: string
          format: uuid
        toArticleId:
          type: string
          format: uuid
        label:
          type: [string, "null"]
        directed:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CalendarMonthInput:
      type: object
      required: [name, days]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        days:
          type: integer
          minimum: 1

    CalendarMonth:
      type: object
      required: [name, days]
      properties:
        name:
          type: string
        days:
          type: integer

    CalendarRequest:
      type: object
      required: [name, months]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        daysPerWeek:
          type: [integer, "null"]
          minimum: 1
        months:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CalendarMonthInput'

    Calendar:
      type: object
      required: [id, worldId, name, months, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        name:
          type: string
        daysPerWeek:
          type: [integer, "null"]
        months:
          type: array
          items:
            $ref: '#/components/schemas/CalendarMonth'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TimelineRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 5000
        calendarId:
          type: [string, "null"]
          format: uuid
          description: Optional calendar used to render and validate event dates.

    Timeline:
      type: object
      required: [id, worldId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        calendarId:
          type: [string, "null"]
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TimelineEventRequest:
      type: object
      required: [title, year]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 5000
        articleId:
          type: [string, "null"]
          format: uuid
        year:
          type: integer
          description: Integer year; negative values denote pre-epoch dates.
        month:
          type: [integer, "null"]
          minimum: 1
        day:
          type: [integer, "null"]
          minimum: 1

    TimelineEvent:
      type: object
      required: [id, timelineId, title, year, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        timelineId:
          type: string
          format: uuid
        articleId:
          type: [string, "null"]
          format: uuid
        title:
          type: string
        description:
          type: [string, "null"]
        year:
          type: integer
        month:
          type: [integer, "null"]
        day:
          type: [integer, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MapRequest:
      type: object
      required: [name, mediaId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        mediaId:
          type: string
          format: uuid
          description: The uploaded image used as the map's base layer.

    Map:
      type: object
      required: [id, worldId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        name:
          type: string
        mediaId:
          type: [string, "null"]
          format: uuid
        imageUrl:
          type: [string, "null"]
          description: Public URL of the base image (null if the image was deleted).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MapPinRequest:
      type: object
      required: [x, y]
      properties:
        articleId:
          type: [string, "null"]
          format: uuid
        label:
          type: [string, "null"]
          maxLength: 200
        layer:
          type: [string, "null"]
          maxLength: 100
          description: Optional group used for toggling visibility.
        x:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Horizontal position as a fraction of image width.
        y:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Vertical position as a fraction of image height.

    MapPin:
      type: object
      required: [id, mapId, x, y, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        mapId:
          type: string
          format: uuid
        articleId:
          type: [string, "null"]
          format: uuid
        label:
          type: [string, "null"]
        layer:
          type: [string, "null"]
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MediaAsset:
      type: object
      required: [id, worldId, filename, contentType, size, url, createdAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        filename:
          type: string
        contentType:
          type: string
        size:
          type: integer
          format: int64
        url:
          type: string
          description: Public URL serving the bytes.
        createdAt:
          type: string
          format: date-time

    ProblemDetail:
      type: object
      description: RFC 9457 / RFC 7807 problem response.
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

security:
  - bearerAuth: []
