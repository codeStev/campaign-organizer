        stats:
          type: object
          additionalProperties: true
          description: Freeform key/value stats (e.g. AC, HP, speed).
        notes:
          type: [string, "null"]
          maxLength: 20000
          description: Freeform notes (Markdown, see ADR-0054).

    Statblock:
      type: object
      required: [id, worldId, name, stats, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        articleId:
          type: [string, "null"]
          format: uuid
        campaignId:
          type: [string, "null"]
          format: uuid
        templateId:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        stats:
          type: object
          additionalProperties: true
        notes:
          type: [string, "null"]
          description: Freeform notes (Markdown, see ADR-0054).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CharacterSheetRequest:
      type: object
      required: [name, templateId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        templateId:
          type: string
