      properties:
        filled:
          type: boolean
        title:
          type: [string, "null"]
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 2000

    ClockRequest:
      type: object
      required: [title, segments]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 5000
        segments:
          type: array
          items:
            $ref: '#/components/schemas/ClockSegment'
        position:
          type: [integer, "null"]
          description: Ordering index within the campaign.

    Clock:
      type: object
      required: [id, campaignId, title, segments, position, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, "null"]
        segments:
          type: array
          items:
            $ref: '#/components/schemas/ClockSegment'
        position:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BeatRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: [string, "null"]
          maxLength: 20000
          description: Beat notes (Markdown, see ADR-0054).
        done:
          type: boolean
          default: false
        articleIds:
          type: array
          items:
            type: string
            format: uuid
          description: Linked articles (place, NPC, item, …).
        statblockIds:
          type: array
          items:
            type: string
            format: uuid
          description: Linked statblocks (goblin spearman, boss, …).
        encounterIds:
          type: array
          items:
            type: string
            format: uuid
          description: Linked encounters (ADR-0097) — structured, quantified combat groupings.
        tableIds:
          type: array
          items:
            type: string
            format: uuid
          description: Linked roll tables.
        deckIds:
          type: array
          items:
            type: string
            format: uuid
          description: Linked card decks.
        sessionId:
          type: [string, "null"]
          format: uuid
          description: Optional session where this beat occurred.
        kindId:
          type: [string, "null"]
          format: uuid
          description: Optional GM-defined beat kind tag (ADR-0101), informational only.
        position:
          type: [integer, "null"]

    Beat:
      type: object
      required: [id, arcId, title, done, articleIds, statblockIds, encounterIds, tableIds, deckIds, position, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        arcId:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: [string, "null"]
          description: Beat notes (Markdown, see ADR-0054).
        done:
          type: boolean
        articleIds:
          type: array
          items:
            type: string
            format: uuid
        statblockIds:
          type: array
          items:
            type: string
            format: uuid
        encounterIds:
          type: array
          items:
            type: string
            format: uuid
        tableIds:
          type: array
          items:
            type: string
            format: uuid
        deckIds:
          type: array
          items:
            type: string
            format: uuid
        sessionId:
          type: [string, "null"]
          format: uuid
        kindId:
          type: [string, "null"]
          format: uuid
          description: Optional GM-defined beat kind tag (ADR-0101), informational only.
        position:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PlayerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200

    Player:
      type: object
      required: [id, worldId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BeatKindRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        color:
          type: [string, "null"]
          maxLength: 20

    BeatKind:
      type: object
      required: [id, worldId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CampaignStatus:
      type: string
      enum: [PLANNED, ACTIVE, ON_HIATUS, COMPLETED]

    CampaignRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 5000
        notes:
          type: [string, "null"]
          maxLength: 20000
          description: Free-text GM notes for the campaign (Markdown, see ADR-0054).
        status:
          $ref: '#/components/schemas/CampaignStatus'
        systemId:
          type: [string, "null"]
          format: uuid
          description: Optional game system this campaign runs (ADR-0095); null = undecided/agnostic.
        color:
          type: [string, "null"]
          maxLength: 20
          description: User-assignable color badge (ADR-0107) — used to distinguish this campaign on the session calendar.

    Campaign:
      type: object
      required: [id, worldId, name, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        notes:
          type: [string, "null"]
          description: Free-text GM notes for the campaign (Markdown, see ADR-0054).
        status:
          $ref: '#/components/schemas/CampaignStatus'
        systemId:
          type: [string, "null"]
          format: uuid
        color:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RosterEntryInput:
      type: object
      required: [playerId]
      properties:
        playerId:
          type: string
          format: uuid
        guest:
          type: boolean
          default: false

    RosterRequest:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/RosterEntryInput'

    RosterEntry:
      type: object
      required: [playerId, name, guest]
      properties:
        playerId:
          type: string
          format: uuid
        name:
          type: string
          description: The player's name, denormalized for display.
        guest:
          type: boolean

    AttendanceEntryInput:
      type: object
      required: [playerId, present]
      properties:
        playerId:
          type: string
          format: uuid
        present:
          type: boolean
        characterId:
          type: [string, "null"]
          format: uuid

    AttendanceRequest:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceEntryInput'

    AttendanceEntry:
      type: object
      required: [playerId, name, guest, present]
      properties:
        playerId:
          type: string
          format: uuid
        name:
          type: string
          description: The player's name, denormalized for display.
        guest:
          type: boolean
        present:
          type: boolean
        characterId:
          type: [string, "null"]
          format: uuid
        characterName:
          type: [string, "null"]
          description: The linked character sheet's name, denormalized for display.

    SessionRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        sessionNumber:
          type: [integer, "null"]
          description: Ordering index within the campaign.
        date:
          type: [string, "null"]
          format: date
          description: Real-world date the session was played.
        summary:
          type: [string, "null"]
          maxLength: 20000
          description: Session summary (Markdown, see ADR-0054).
        notes:
          type: [string, "null"]
          maxLength: 20000
          description: Private GM notes for the session (Markdown, see ADR-0054).

    CheatSheetFragmentInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [FREEFORM, STATBLOCK, TABLE_ROW, DECK_CARD]
        text:
          type: [string, "null"]
          description: Freeform Markdown; required for FREEFORM.
        statblockId:
          type: [string, "null"]
          format: uuid
          description: Required for STATBLOCK.
        tableId:
          type: [string, "null"]
          format: uuid
        entryId:
          type: [string, "null"]
          format: uuid
          description: Required for TABLE_ROW (with tableId).
        deckId:
          type: [string, "null"]
          format: uuid
        cardId:
          type: [string, "null"]
          format: uuid
          description: Required for DECK_CARD (with deckId).

    CheatSheetRequest:
      type: object
      required: [fragments]
      properties:
        fragments:
          type: array
          items:
            $ref: '#/components/schemas/CheatSheetFragmentInput'

    CheatSheetFragment:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [FREEFORM, STATBLOCK, TABLE_ROW, DECK_CARD]
        text:
          type: [string, "null"]
        statblockId:
          type: [string, "null"]
          format: uuid
        tableId:
          type: [string, "null"]
          format: uuid
        entryId:
          type: [string, "null"]
          format: uuid
        deckId:
          type: [string, "null"]
          format: uuid
        cardId:
          type: [string, "null"]
          format: uuid

    CheatSheet:
      type: object
      required: [id, sessionId, fragments, createdAt, updatedAt]
      properties:
        id:
          type: [string, "null"]
          format: uuid
          description: Null when no cheat sheet has been saved for the session yet.
        sessionId:
          type: string
          format: uuid
        fragments:
          type: array
          items:
            $ref: '#/components/schemas/CheatSheetFragment'
        createdAt:
          type: [string, "null"]
          format: date-time
        updatedAt:
          type: [string, "null"]
          format: date-time

    LooseThreadStatus:
      type: string
      enum: [OPEN, RESOLVED, ABANDONED]

    LooseThreadRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
        status:
          $ref: '#/components/schemas/LooseThreadStatus'

    LooseThread:
      type: object
      required: [id, sessionId, campaignId, text, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        text:
          type: string
        status:
          $ref: '#/components/schemas/LooseThreadStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TodoRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000

    TodoUpdateRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
        done:
          type: boolean
          default: false

    Todo:
      type: object
      required: [id, campaignId, text, done, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        sessionId:
          type: [string, "null"]
          format: uuid
          description: Null for a standing campaign-level todo.
        text:
          type: string
        done:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Session:
      type: object
      required: [id, campaignId, title, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        title:
          type: string
        sessionNumber:
          type: [integer, "null"]
        date:
          type: [string, "null"]
          format: date
        summary:
          type: [string, "null"]
          description: Session summary (Markdown, see ADR-0054).
        notes:
          type: [string, "null"]
          description: Private GM notes for the session (Markdown, see ADR-0054).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PacketBeat:
      type: object
      required: [id, title, done, articleIds]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: [string, "null"]
          description: Beat notes (Markdown, see ADR-0054).
        done:
          type: boolean
        arcTitle:
          type: [string, "null"]
        articleIds:
          type: array
          items:
            type: string
            format: uuid

    PacketArticle:
      type: object
      required: [id, title, template]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        template:
          type: string
        parentArticleId:
          type: [string, "null"]
          format: uuid
          description: Structural parent (ADR-0080), for nesting in the print-selection tree.
        bodyHtml:
          type: [string, "null"]

    PacketPin:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
        y:
          type: number
        label:
          type: [string, "null"]

    PacketMap:
      type: object
      required: [id, name, pins]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        imageUrl:
          type: [string, "null"]
        pins:
          type: array
          items:
            $ref: '#/components/schemas/PacketPin'

    PacketHandout:
      type: object
      required: [id, title, preset, body]
      description: >
        A handout tagged to this session (ADR-0077). Body is raw Markdown -
        handouts render client-side, like the packet's other freeform text.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        preset:
          type: string
        body:
          type: string

    PacketClockSegment:
      type: object
      description: >-
        Deliberately carries no fill state - the packet prints a blank
        diagram for hand-marking at the table (ADR-0084).
      properties:
        title:
          type: [string, "null"]
        description:
          type: [string, "null"]

    PacketClock:
      type: object
      required: [id, title, segments]
      description: >
        One of the campaign's clocks (ADR-0084), included unconditionally
        (not filtered by beat reference, like the packet's statblocks).
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, "null"]
        segments:
          type: array
          items:
            $ref: '#/components/schemas/PacketClockSegment'

    SessionPacket:
      type: object
      required: [session, campaignName, beats, articles, maps, statblocks, rollTables, cardDecks, handouts, clocks]
      description: Everything needed to run one session, aggregated for print.
      properties:
        session:
          $ref: '#/components/schemas/Session'
        campaignName:
          type: string
        beats:
          type: array
          items:
            $ref: '#/components/schemas/PacketBeat'
        articles:
          type: array
          items:
            $ref: '#/components/schemas/PacketArticle'
        maps:
          type: array
          items:
            $ref: '#/components/schemas/PacketMap'
        statblocks:
          type: array
          items:
            $ref: '#/components/schemas/Statblock'
        rollTables:
          type: array
          description: >
            Roll tables linked by the session's beats. Articles referenced from
            entry outcome texts appear once in `articles` (first-seen order).
          items:
            $ref: '#/components/schemas/PacketRollTable'
        cardDecks:
          type: array
          description: Card decks linked by the session's beats.
          items:
            $ref: '#/components/schemas/PacketCardDeck'
        handouts:
          type: array
          description: Handouts tagged to this session (ADR-0077).
          items:
            $ref: '#/components/schemas/PacketHandout'
        clocks:
          type: array
          description: >-
            All of the campaign's clocks (ADR-0084), unconditionally - a
            clock has no beat linkage to filter by.
          items:
            $ref: '#/components/schemas/PacketClock'
        cheatSheet:
          allOf:
            - $ref: '#/components/schemas/PacketCheatSheet'
          nullable: true
          description: >-
            Absent/null when the session has no saved cheat sheet, or an
            empty one (ADR-0086).

    PacketCheatSheetFragment:
      type: object
      required: [type, missing]
      description: >-
        One fragment of the session's cheat sheet, resolved fresh from its
        source at print time, same as the standalone cheat sheet view
        (ADR-0071, ADR-0086).
      properties:
        type:
          type: string
          enum: [FREEFORM, STATBLOCK, TABLE_ROW, DECK_CARD]
        missing:
          type: boolean
          description: True when the fragment's referenced content no longer exists.
        text:
          type: [string, "null"]
          description: FREEFORM only.
        statblock:
          allOf:
            - $ref: '#/components/schemas/Statblock'
          nullable: true
          description: STATBLOCK only.
        tableTitle:
          type: [string, "null"]
          description: TABLE_ROW only - the containing table's title, for context.
        tableEntry:
          allOf:
            - $ref: '#/components/schemas/PacketRollTableEntry'
          nullable: true
          description: TABLE_ROW only.
        deckTitle:
          type: [string, "null"]
          description: DECK_CARD only - the containing deck's title, for context.
        deckCard:
          allOf:
            - $ref: '#/components/schemas/PacketDeckCard'
          nullable: true
          description: DECK_CARD only.

    PacketCheatSheet:
      type: object
      required: [id, fragments]
      properties:
        id:
          type: string
          format: uuid
        fragments:
          type: array
          items:
            $ref: '#/components/schemas/PacketCheatSheetFragment'

    RollTableEntryInput:
      type: object
      required: [body]
      properties:
        minResult:
          type: [integer, "null"]
          description: Inclusive lower bound of the covered result range; null = unbounded below.
        maxResult:
          type: [integer, "null"]
          description: Inclusive upper bound of the covered result range; null = unbounded above.
        body:
          type: string
          description: Outcome text as Markdown; supports [[wiki-links]] (ADR-0014).
        nestedTableIds:
          type: array
          items:
            type: string
            format: uuid
          description: Roll tables chained after this row resolves (FR-41); each must exist in this world.
        nestedDeckIds:
          type: array
          items:
            type: string
            format: uuid
          description: Card decks chained after this row resolves (FR-41); each must exist in this world.

    RollTableEntry:
      type: object
      required: [id, body]
      properties:
        id:
          type: string
          format: uuid
        minResult:
          type: [integer, "null"]
        maxResult:
          type: [integer, "null"]
        body:
          type: string
        nestedTableIds:
          type: array
          items:
            type: string
            format: uuid
        nestedDeckIds:
          type: array
          items:
            type: string
            format: uuid

    RollTableRequest:
      type: object
      required: [title, diceExpression, entries]
      properties:
        categoryId:
          type: [string, "null"]
          format: uuid
          description: Table/deck category (ADR-0105); null for uncategorized.
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
        diceExpression:
          type: string
          minLength: 1
          maxLength: 100
          description: Dice expression defining the result range, e.g. "2d6" or "1d20+3".
        entries:
          type: array
          description: >
            Outcome rows mapped onto the result range. Ranges may not overlap;
            gaps are allowed (a rolled gap yields no row).
          items:
            $ref: '#/components/schemas/RollTableEntryInput'

    RollTable:
      type: object
      required: [id, worldId, title, diceExpression, minResult, maxResult, entries, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        categoryId:
          type: [string, "null"]
          format: uuid
        title:
          type: string
        description:
          type: [string, "null"]
        diceExpression:
          type: string
        minResult:
          type: integer
          description: Smallest possible total of the dice expression.
        maxResult:
          type: integer
          description: Largest possible total of the dice expression.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/RollTableEntry'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DeckCardInput:
      type: object
      required: [body]
      properties:
        title:
          type: [string, "null"]
          maxLength: 200
        body:
          type: string
          description: Card text as Markdown; supports [[wiki-links]] (ADR-0014).
        nestedTableIds:
          type: array
          items:
            type: string
            format: uuid
          description: Roll tables chained when this card is drawn (FR-41); each must exist in this world.
        nestedDeckIds:
          type: array
          items:
            type: string
            format: uuid
          description: Card decks chained when this card is drawn (FR-41); each must exist in this world.

    CardDeckRequest:
      type: object
      required: [title, cards]
      properties:
        categoryId:
          type: [string, "null"]
          format: uuid
          description: Table/deck category (ADR-0105); null for uncategorized.
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
        cards:
          type: array
          description: Cards in deck order (top of the deck first).
          items:
            $ref: '#/components/schemas/DeckCardInput'

    DeckCard:
      type: object
      required: [id, body]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: [string, "null"]
        body:
          type: string
        nestedTableIds:
          type: array
          items:
            type: string
            format: uuid
        nestedDeckIds:
          type: array
          items:
            type: string
            format: uuid

    CardDeck:
      type: object
      required: [id, worldId, title, cards, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        categoryId:
          type: [string, "null"]
          format: uuid
        title:
          type: string
        description:
          type: [string, "null"]
        cards:
          type: array
          items:
            $ref: '#/components/schemas/DeckCard'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TableDeckCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        parentId:
          type: [string, "null"]
          format: uuid
          description: Parent table/deck category for nesting, or null for a root category.

    TableDeckCategory:
      type: object
      required: [id, worldId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        parentId:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    HandoutRequest:
      type: object
      required: [title, preset]
      properties:
        categoryId:
          type: [string, "null"]
          format: uuid
          description: Handout category (ADR-0105); null for uncategorized.
        title:
          type: string
          minLength: 1
          maxLength: 200
        preset:
          type: string
          enum: [PARCHMENT, NEWSPAPER, POSTER, LETTER]
          description: Visual style applied to the printed handout.
        body:
          type: [string, "null"]
          description: Markdown body (wiki-links render as anchors).
        sessionId:
          type: [string, "null"]
          format: uuid
          description: >
            Session this handout is prepped for (ADR-0077); null for a
            general/unassigned handout. Operational grouping for packet
            assembly only - not a wiki-graph link (ADR-0070).
        revealed:
          type: boolean
          default: false
          description: >
            Screen-only prep flag: has the GM revealed this to players?
            Not access control (single-user app, no player-facing surface)
            and doesn't affect printing.

    ReorderHandoutsRequest:
      type: object
      required: [orderedIds]
      properties:
        orderedIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    Handout:
      type: object
      required: [id, worldId, title, preset, body, revealed, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        categoryId:
          type: [string, "null"]
          format: uuid
        title:
          type: string
        preset:
          type: string
          enum: [PARCHMENT, NEWSPAPER, POSTER, LETTER]
        body:
          type: [string, "null"]
        sessionId:
          type: [string, "null"]
          format: uuid
        revealed:
          type: boolean
          description: Screen-only prep flag; not access control (ADR-0079).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    HandoutCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        parentId:
          type: [string, "null"]
          format: uuid
          description: Parent handout category for nesting, or null for a root category.

    HandoutCategory:
      type: object
      required: [id, worldId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        parentId:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PacketRollTableEntry:
      type: object
      required: [minResult, maxResult, bodyHtml]
      properties:
        minResult:
          type: [integer, "null"]
        maxResult:
          type: [integer, "null"]
        bodyHtml:
          type: [string, "null"]
          description: Rendered outcome HTML (Markdown + resolved wiki-links).

    PacketRollTable:
      type: object
      required: [id, title, diceExpression, minResult, maxResult, entries]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        diceExpression:
          type: string
        minResult:
          type: integer
        maxResult:
          type: integer
        entries:
          type: array
          items:
            $ref: '#/components/schemas/PacketRollTableEntry'

    PacketDeckCard:
      type: object
      required: [title, bodyHtml]
      properties:
        title:
          type: [string, "null"]
        bodyHtml:
          type: [string, "null"]

    PacketCardDeck:
      type: object
      required: [id, title, cards]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        cards:
          type: array
          items:
            $ref: '#/components/schemas/PacketDeckCard'

    LoginRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          description: The configured application password.
          examples: ["changeme"]

    TokenResponse:
      type: object
      required: [token, tokenType, expiresAt]
      properties:
        token:
          type: string
          description: "Signed JWT to send as `Authorization: Bearer <token>`."
        tokenType:
          type: string
          const: Bearer
        expiresAt:
          type: string
          format: date-time
          description: Expiry instant of the token (UTC).

    WorldRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          examples: ["Aethelgard"]
        description:
          type: string
          maxLength: 5000
          description: Optional summary of the world.
        scratch:
          type: boolean
          default: false
          description: >-
            Cosmetic-only sandbox/brainstorming flag (FR-60) — no functional
            effect, just a label in the world list and switcher.

    World:
      type: object
      required: [id, name, scratch, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        layerStyles:
          $ref: '#/components/schemas/LayerStyleMap'
        scratch:
          type: boolean
          description: >-
            Cosmetic-only sandbox/brainstorming flag (FR-60) — no functional
            effect, just a label in the world list and switcher.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LayerStyle:
      type: object
      description: Styling for a map layer.
      properties:
        color:
          type: [string, "null"]
        icon:
          type: [string, "null"]

    LayerStyleMap:
      type: object
      description: Per-layer styling keyed by layer name.
      additionalProperties:
        $ref: '#/components/schemas/LayerStyle'

    CategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        parentId:
          type: [string, "null"]
          format: uuid
          description: Parent category for nesting, or null for a root category.

    Category:
      type: object
      required: [id, worldId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        parentId:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ArticleTemplate:
      type: string
      description: The kind of article; drives structured prompts later.
      enum: [GENERIC, CHARACTER, LOCATION, ORGANIZATION, SPECIES, ITEM, EVENT]

    ArticleTemplateSection:
      type: object
      required: [heading, hint]
      properties:
        heading:
          type: string
        hint:
          type: string

    ArticleTemplateInfo:
      type: object
      required: [template, label, sections]
      properties:
        template:
          $ref: '#/components/schemas/ArticleTemplate'
        label:
          type: string
        sections:
          type: array
          items:
            $ref: '#/components/schemas/ArticleTemplateSection'

    ArticleRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          maxLength: 220
          description: >
            Optional URL-safe identifier, unique per world. Generated from the
            title (and de-duplicated) when omitted.
        template:
          $ref: '#/components/schemas/ArticleTemplate'
        categoryId:
          type: [string, "null"]
          format: uuid
        parentArticleId:
          type: [string, "null"]
          format: uuid
          description: >
            Structural parent for sidebar nesting (e.g. a sub-location under
            its parent location), or null for a top-level article.
            Independent of categoryId, which is a separate taxonomy grouping.
        body:
          type: string
          description: Article body as Markdown (see ADR-0054).

    ArticleSummary:
      type: object
      required: [id, worldId, title, slug, template, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        categoryId:
          type: [string, "null"]
          format: uuid
        parentArticleId:
          type: [string, "null"]
          format: uuid
        title:
          type: string
        slug:
          type: string
        template:
          $ref: '#/components/schemas/ArticleTemplate'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Article:
      allOf:
        - $ref: '#/components/schemas/ArticleSummary'
        - type: object
          required: [body]
          properties:
            body:
              type: [string, "null"]
              description: >
                Raw article body as Markdown, including `[[target]]`
                wiki-links (see ADR-0054).
            bodyHtml:
              type: [string, "null"]
              readOnly: true
              description: >
                Rendered body: Markdown converted to HTML (see ADR-0054),
                then wiki-links resolved to anchors (see ADR-0014).
                Read-only; derived from `body`.

    Usage:
      type: object
      required: [type, label]
      properties:
        type:
          type: string
          enum: [BEAT, MAP_PIN, TIMELINE_EVENT, RELATIONSHIP, CHARACTER_SHEET, STATBLOCK, ARTICLE_LINK, ROLL_TABLE, CARD_DECK, CHILD_ARTICLE]
        label:
          type: string
        targetId:
          type: [string, "null"]
          format: uuid
          description: An article the client can open (RELATIONSHIP, ARTICLE_LINK, CHILD_ARTICLE); else null.
        campaignId:
          type: [string, "null"]
          format: uuid
        campaignName:
          type: [string, "null"]

    UsageResponse:
      type: object
      required: [usages]
      properties:
        usages:
          type: array
          items:
            $ref: '#/components/schemas/Usage'

    ConsistencyReport:
      type: object
      required: [brokenLinks, orphanedArticles, unreferencedByCampaigns]
      properties:
        brokenLinks:
          type: array
          items:
            $ref: '#/components/schemas/BrokenLink'
        orphanedArticles:
          type: array
          description: Articles no article body, beat, roll-table entry or deck card links or references.
          items:
            $ref: '#/components/schemas/ConsistencyArticle'
        unreferencedByCampaigns:
          type: array
          description: Articles no campaign references via beats, sheets or statblocks.
          items:
            $ref: '#/components/schemas/ConsistencyArticle'

    BrokenLink:
      type: object
      required: [sourceType, sourceId, sourceLabel, target]
      properties:
        sourceType:
          type: string
          enum: [ARTICLE, BEAT, ROLL_TABLE, CARD_DECK]
        sourceId:
          type: string
          format: uuid
        sourceLabel:
          type: string
        target:
          type: string
          description: The unresolved (lowercased) [[link]] target as written.

    ConsistencyArticle:
      type: object
      required: [articleId, title]
      properties:
        articleId:
          type: string
          format: uuid
        title:
          type: string

    WorldOverviewStats:
      type: object
      required: [articleCount, sessionsRunCount, recentlyEdited, openClocks, openLooseThreads, scheduledSessions]
      properties:
        articleCount:
          type: integer
        sessionsRunCount:
          type: integer
          description: Sessions across every campaign in the world dated on or before today.
        recentlyEdited:
          type: array
          description: The 5 most recently updated articles.
          items:
            $ref: '#/components/schemas/RecentlyEditedArticle'
        nextSession:
          allOf:
            - $ref: '#/components/schemas/NextSessionSummary'
          nullable: true
          description: The nearest session across every campaign dated strictly after today, or absent if none is scheduled.
        openClocks:
          type: array
          description: Not-yet-full clocks across every campaign, most-filled-first, capped at 8.
          items:
            $ref: '#/components/schemas/ClockSummary'
        openLooseThreads:
          type: array
          description: Open (unresolved) loose threads across every campaign, newest-first, capped at 8.
          items:
            $ref: '#/components/schemas/LooseThreadSummary'
        scheduledSessions:
          type: array
          description: Every dated session across every campaign in the world, date-ascending (ADR-0107, for the session calendar).
          items:
            $ref: '#/components/schemas/ScheduledSessionSummary'

    RecentlyEditedArticle:
      type: object
      required: [articleId, title, updatedAt]
      properties:
        articleId:
          type: string
          format: uuid
        title:
          type: string
        updatedAt:
          type: string
          format: date-time

    NextSessionSummary:
      type: object
      required: [sessionId, campaignId, campaignName, title, date]
      properties:
        sessionId:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        campaignName:
          type: string
        title:
          type: string
        date:
          type: string
          format: date
        sessionNumber:
          type: [integer, "null"]

    ClockSummary:
      type: object
      required: [clockId, campaignId, campaignName, title, filledSegments, totalSegments]
      properties:
        clockId:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        campaignName:
          type: string
        title:
          type: string
        filledSegments:
          type: integer
        totalSegments:
          type: integer

    LooseThreadSummary:
      type: object
      required: [threadId, campaignId, campaignName, text]
      properties:
        threadId:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        campaignName:
          type: string
        text:
          type: string

    ScheduledSessionSummary:
      type: object
      required: [sessionId, campaignId, campaignName, title, date]
      properties:
        sessionId:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        campaignName:
          type: string
        campaignColor:
          type: [string, "null"]
          description: The campaign's raw persisted color (ADR-0107) — null if unset; the frontend resolves a fallback.
        title:
          type: string
        sessionNumber:
          type: [integer, "null"]
        date:
          type: string
          format: date

    ArticleRevision:
      type: object
      required: [id, articleId, title, slug, template, createdAt]
      properties:
        id:
          type: string
          format: uuid
        articleId:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        template:
          $ref: '#/components/schemas/ArticleTemplate'
        body:
          type: [string, "null"]
          description: Snapshotted article body as Markdown (see ADR-0054).
        createdAt:
          type: string
          format: date-time

    RelationshipRequest:
      type: object
      required: [fromArticleId, toArticleId]
      properties:
        fromArticleId:
          type: string
          format: uuid
        toArticleId:
          type: string
          format: uuid
        label:
          type: [string, "null"]
          maxLength: 100
          description: Free-text relationship, e.g. "parent of", "allied with".
        directed:
          type: boolean
          default: true
          description: When true, the link has a direction from -> to.

    Relationship:
      type: object
      required: [id, worldId, fromArticleId, toArticleId, directed, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        fromArticleId:
          type: string
          format: uuid
        toArticleId:
          type: string
          format: uuid
        label:
          type: [string, "null"]
        directed:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CalendarMonthInput:
      type: object
      required: [name, days]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        days:
          type: integer
          minimum: 1

    CalendarMonth:
      type: object
      required: [name, days]
      properties:
        name:
          type: string
        days:
          type: integer

    CalendarRequest:
      type: object
      required: [name, months]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        daysPerWeek:
          type: [integer, "null"]
          minimum: 1
        months:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CalendarMonthInput'

    Calendar:
      type: object
      required: [id, worldId, name, months, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        name:
          type: string
        daysPerWeek:
          type: [integer, "null"]
        months:
          type: array
          items:
            $ref: '#/components/schemas/CalendarMonth'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TimelineRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 5000
        calendarId:
          type: [string, "null"]
          format: uuid
          description: Optional calendar used to render and validate event dates.

    Timeline:
      type: object
      required: [id, worldId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        calendarId:
          type: [string, "null"]
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TimelineEventRequest:
      type: object
      required: [title, year]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 5000
        articleId:
          type: [string, "null"]
          format: uuid
        year:
          type: integer
          description: Integer year; negative values denote pre-epoch dates.
        month:
          type: [integer, "null"]
          minimum: 1
        day:
          type: [integer, "null"]
          minimum: 1

    TimelineEvent:
      type: object
      required: [id, timelineId, title, year, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        timelineId:
          type: string
          format: uuid
        articleId:
          type: [string, "null"]
          format: uuid
        title:
          type: string
        description:
          type: [string, "null"]
        year:
          type: integer
        month:
          type: [integer, "null"]
        day:
          type: [integer, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MapRequest:
      type: object
      required: [name, mediaId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        mediaId:
          type: string
          format: uuid
          description: The uploaded image used as the map's base layer.
        categoryId:
          type: [string, "null"]
          format: uuid
          description: Map category for the Atlas tree (ADR-0105), or null for uncategorized.

    Map:
      type: object
      required: [id, worldId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        categoryId:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        mediaId:
          type: [string, "null"]
          format: uuid
        imageUrl:
          type: [string, "null"]
          description: Public URL of the base image (null if the image was deleted).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MapCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        parentId:
          type: [string, "null"]
          format: uuid
          description: Parent map category for nesting, or null for a root category.

    MapCategory:
      type: object
      required: [id, worldId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        parentId:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MapPinRequest:
      type: object
      required: [x, y]
      properties:
        articleId:
          type: [string, "null"]
          format: uuid
        label:
          type: [string, "null"]
          maxLength: 200
        layer:
          type: [string, "null"]
          maxLength: 100
          description: Optional group used for toggling visibility.
        x:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Horizontal position as a fraction of image width.
        y:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Vertical position as a fraction of image height.

    MapPin:
      type: object
      required: [id, mapId, x, y, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        mapId:
          type: string
          format: uuid
        articleId:
          type: [string, "null"]
          format: uuid
        label:
          type: [string, "null"]
        layer:
          type: [string, "null"]
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MediaAsset:
      type: object
      required: [id, worldId, filename, contentType, size, url, createdAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        filename:
          type: string
        contentType:
          type: string
        size:
          type: integer
          format: int64
        url:
          type: string
          description: Public URL serving the bytes.
        createdAt:
          type: string
          format: date-time

    ProblemDetail:
      type: object
      description: RFC 9457 / RFC 7807 problem response.
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

security:
  - bearerAuth: []
