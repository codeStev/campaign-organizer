          format: uuid
          description: Null when no cheat sheet has been saved for the session yet.
        sessionId:
          type: string
          format: uuid
        fragments:
          type: array
          items:
            $ref: '#/components/schemas/CheatSheetFragment'
        createdAt:
          type: [string, "null"]
          format: date-time
        updatedAt:
          type: [string, "null"]
          format: date-time

    Session:
      type: object
      required: [id, campaignId, title, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        title:
          type: string
        sessionNumber:
          type: [integer, "null"]
        date:
          type: [string, "null"]
          format: date
        summary:
          type: [string, "null"]
          description: Session summary (Markdown, see ADR-0054).
        notes:
          type: [string, "null"]
          description: Private GM notes for the session (Markdown, see ADR-0054).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PacketBeat:
      type: object
      required: [id, title, done, articleIds]
      properties:
        id:
