openapi: 3.1.0
info:
  title: Campaign Organizer API
  version: 0.1.0
  description: >
    Personal worldbuilding and RPG campaign management application.
    This document is the **canonical, design-first contract** for the API.
    Both the Spring Boot backend and the React/TypeScript frontend are expected
    to conform to it (see docs/adr/0008-contract-first-openapi.md).

    Phase 0 covers single-password authentication and the `worlds` resource,
    which is the top-level container every other domain object will hang off of.
  license:
    name: Proprietary (personal use)
  contact:
    name: Campaign Organizer

servers:
  - url: /api
    description: Same-origin API root (frontend proxies /api to the backend)

tags:
  - name: auth
    description: Authentication for the single owner user.
  - name: worlds
    description: Top-level worldbuilding containers.
  - name: categories
    description: Hierarchical grouping of articles within a world.
  - name: articles
    description: Wiki articles within a world.
  - name: templates
    description: Static article template definitions and prompts.
  - name: media
    description: Uploaded images stored on the local volume.
  - name: maps
    description: Interactive maps and their article-linked pins.
  - name: timelines
    description: Timelines and their dated, article-linked events.
  - name: calendars
    description: Custom fantasy calendars with named months.
  - name: relationships
    description: Directed or undirected links between articles (relationship webs).
  - name: campaigns
    description: Gamemaster campaigns and their play sessions.
  - name: arcs
    description: Story arcs and their ordered beats within a campaign.
  - name: sheets
    description: Schema-driven character sheet templates and character sheets.
  - name: dice
    description: Stateless dice roller.
  - name: statblocks
    description: Reusable NPC/monster statblocks.
  - name: export
    description: Export a world as a JSON bundle.
  - name: whiteboards
    description: Free-form plotting whiteboards (nodes and connections).
  - name: backup
    description: Instance-wide backup and restore (per-world JSON + media).
  - name: ai
    description: >-
      Prep-time AI text drafting via a cloud LLM (ADR-0064). Stateless;
      nothing here is persisted.

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Exchange the app password for a bearer token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'

  /backup:
    get:
      tags: [backup]
      summary: Download a full instance backup (every world + media) as a ZIP (FR-36)
      operationId: downloadBackup
      responses:
        '200':
          description: >
            A ZIP containing manifest.json (world ids + export time),
            worlds/<worldId>.json (one export bundle per world, per
            GET /worlds/{worldId}/export's shape, plus that world's media
            metadata) and media/<worldId>/<mediaId> for every referenced
            media file. See ADR-0061.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backup/import:
    post:
      tags: [backup]
      summary: Import a backup ZIP produced by GET /backup (ADR-0061)
      operationId: importBackup
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [mode, file]
              properties:
                mode:
                  type: string
                  enum: [ADDITIVE, OVERWRITE]
                  description: >
                    ADDITIVE adds the backup's worlds as new data, each with
                    freshly generated ids — nothing existing is touched.
                    OVERWRITE deletes every existing world first.
                file:
                  type: string
                  format: binary
      responses:
        '204':
          description: Import succeeded.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /worlds:
    get:
      tags: [worlds]
      summary: List all worlds
      operationId: listWorlds
      responses:
        '200':
          description: All worlds owned by the user, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/World'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [worlds]
      summary: Create a world
      operationId: createWorld
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorldRequest'
      responses:
        '201':
          description: World created.
          headers:
            Location:
              description: URI of the created world.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/World'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /worlds/{worldId}:
    parameters:
      - $ref: '#/components/parameters/WorldId'
    get:
      tags: [worlds]
      summary: Get a single world
      operationId: getWorld
      responses:
        '200':
          description: The world.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/World'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [worlds]
      summary: Update a world
      operationId: updateWorld
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorldRequest'
      responses:
        '200':
          description: World updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/World'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [worlds]
      summary: Delete a world
      operationId: deleteWorld
      responses:
        '204':
          description: World deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/layer-styles:
    parameters:
      - $ref: '#/components/parameters/WorldId'
    get:
      tags: [worlds]
      summary: Get per-layer map styling (colour + icon) for a world
      operationId: getLayerStyles
      responses:
        '200':
          description: Layer styles, keyed by layer name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayerStyleMap'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [worlds]
      summary: Replace per-layer map styling for a world
      operationId: putLayerStyles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LayerStyleMap'
      responses:
        '200':
          description: Updated layer styles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayerStyleMap'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /article-templates:
    get:
      tags: [templates]
      summary: List article template definitions and their prompts
      operationId: listArticleTemplates
      responses:
        '200':
          description: All template definitions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleTemplateInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /worlds/{worldId}/media:
    parameters:
      - $ref: '#/components/parameters/WorldId'
    get:
      tags: [media]
      summary: List a world's media assets
      operationId: listMedia
      responses:
        '200':
          description: Media assets, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaAsset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [media]
      summary: Upload an image
      operationId: uploadMedia
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Media uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/media/{mediaId}:
    parameters:
      - $ref: '#/components/parameters/WorldId'
      - $ref: '#/components/parameters/MediaId'
    delete:
      tags: [media]
      summary: Delete a media asset
      operationId: deleteMedia
      responses:
        '204':
          description: Media deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /media/{mediaId}/content:
    parameters:
      - $ref: '#/components/parameters/MediaId'
    get:
      tags: [media]
      summary: Serve raw image bytes (public, addressed by unguessable id)
      operationId: getMediaContent
      security: []
      responses:
        '200':
          description: The image bytes.
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/maps:
    parameters:
      - $ref: '#/components/parameters/WorldId'
    get:
      tags: [maps]
      summary: List a world's maps
      operationId: listMaps
      responses:
        '200':
          description: Maps in the world, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Map'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [maps]
      summary: Create a map from an uploaded image
      operationId: createMap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapRequest'
      responses:
        '201':
          description: Map created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Map'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/maps/{mapId}:
    parameters:
      - $ref: '#/components/parameters/WorldId'
      - $ref: '#/components/parameters/MapId'
    get:
      tags: [maps]
      summary: Get a map
      operationId: getMap
      responses:
        '200':
          description: The map.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Map'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [maps]
      summary: Update a map
      operationId: updateMap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapRequest'
      responses:
        '200':
          description: Map updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Map'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [maps]
      summary: Delete a map (and its pins)
      operationId: deleteMap
      responses:
        '204':
          description: Map deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/maps/{mapId}/pins:
    parameters:
      - $ref: '#/components/parameters/WorldId'
      - $ref: '#/components/parameters/MapId'
    get:
      tags: [maps]
      summary: List a map's pins
      operationId: listPins
      responses:
        '200':
          description: Pins on the map.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MapPin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [maps]
      summary: Add a pin to a map
      operationId: createPin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapPinRequest'
      responses:
        '201':
          description: Pin created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapPin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/maps/{mapId}/pins/{pinId}:
    parameters:
      - $ref: '#/components/parameters/WorldId'
      - $ref: '#/components/parameters/MapId'
      - $ref: '#/components/parameters/PinId'
    put:
      tags: [maps]
      summary: Update a pin
      operationId: updatePin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapPinRequest'
      responses:
        '200':
          description: Pin updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapPin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [maps]
      summary: Delete a pin
      operationId: deletePin
      responses:
        '204':
          description: Pin deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/relationships:
    parameters:
      - $ref: '#/components/parameters/WorldId'
    get:
      tags: [relationships]
      summary: List all relationships in a world (the full graph)
      operationId: listRelationships
      responses:
        '200':
          description: All relationship edges in the world.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Relationship'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [relationships]
      summary: Create a relationship between two articles
      operationId: createRelationship
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipRequest'
      responses:
        '201':
          description: Relationship created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/relationships/{relationshipId}:
    parameters:
      - $ref: '#/components/parameters/WorldId'
      - $ref: '#/components/parameters/RelationshipId'
    put:
      tags: [relationships]
      summary: Update a relationship
      operationId: updateRelationship
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipRequest'
      responses:
        '200':
          description: Relationship updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [relationships]
      summary: Delete a relationship
      operationId: deleteRelationship
      responses:
        '204':
          description: Relationship deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/articles/{articleId}/relationships:
    parameters:
      - $ref: '#/components/parameters/WorldId'
      - $ref: '#/components/parameters/ArticleId'
    get:
      tags: [relationships]
      summary: List relationships touching one article (its neighbourhood)
      operationId: listArticleRelationships
      responses:
        '200':
          description: Edges where the article is either endpoint.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Relationship'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/calendars:
    parameters:
      - $ref: '#/components/parameters/WorldId'
    get:
      tags: [calendars]
      summary: List a world's calendars
      operationId: listCalendars
      responses:
        '200':
          description: Calendars in the world, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Calendar'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [calendars]
      summary: Create a calendar
      operationId: createCalendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarRequest'
      responses:
        '201':
          description: Calendar created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/calendars/{calendarId}:
    parameters:
      - $ref: '#/components/parameters/WorldId'
      - $ref: '#/components/parameters/CalendarId'
    put:
      tags: [calendars]
      summary: Update a calendar (replaces its months)
      operationId: updateCalendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarRequest'
      responses:
        '200':
          description: Calendar updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [calendars]
      summary: Delete a calendar
      operationId: deleteCalendar
      responses:
        '204':
          description: Calendar deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/timelines:
    parameters:
      - $ref: '#/components/parameters/WorldId'
    get:
      tags: [timelines]
      summary: List a world's timelines
      operationId: listTimelines
      responses:
        '200':
          description: Timelines in the world, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Timeline'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [timelines]
      summary: Create a timeline
      operationId: createTimeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimelineRequest'
      responses:
        '201':
          description: Timeline created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timeline'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/timelines/{timelineId}:
    parameters:
      - $ref: '#/components/parameters/WorldId'
      - $ref: '#/components/parameters/TimelineId'
    put:
      tags: [timelines]
      summary: Update a timeline
      operationId: updateTimeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimelineRequest'
      responses:
        '200':
          description: Timeline updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timeline'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [timelines]
      summary: Delete a timeline (and its events)
      operationId: deleteTimeline
      responses:
        '204':
          description: Timeline deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/timelines/{timelineId}/events:
    parameters:
      - $ref: '#/components/parameters/WorldId'
      - $ref: '#/components/parameters/TimelineId'
    get:
      tags: [timelines]
      summary: List a timeline's events (chronological)
      operationId: listEvents
      responses:
        '200':
          description: Events ordered by year, month, day.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimelineEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [timelines]
      summary: Add an event to a timeline
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimelineEventRequest'
      responses:
        '201':
          description: Event created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/timelines/{timelineId}/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/WorldId'
      - $ref: '#/components/parameters/TimelineId'
      - $ref: '#/components/parameters/EventId'
    put:
      tags: [timelines]
      summary: Update an event
      operationId: updateEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimelineEventRequest'
      responses:
        '200':
          description: Event updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [timelines]
      summary: Delete an event
      operationId: deleteEvent
      responses:
        '204':
          description: Event deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/campaigns:
    parameters:
      - $ref: '#/components/parameters/WorldId'
    get:
      tags: [campaigns]
      summary: List a world's campaigns
      operationId: listCampaigns
      responses:
        '200':
          description: Campaigns in the world, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Campaign'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [campaigns]
      summary: Create a campaign
