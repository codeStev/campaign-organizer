  /worlds/{worldId}/articles/{articleId}:
    parameters:
      - $ref: '#/components/parameters/WorldId'
      - $ref: '#/components/parameters/ArticleId'
    get:
      tags: [articles]
      summary: Get a single article
      operationId: getArticle
      responses:
        '200':
          description: The article, with rendered (auto-linked) body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [articles]
      summary: Update an article
      operationId: updateArticle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleRequest'
      responses:
        '200':
          description: Article updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [articles]
      summary: Delete an article
      operationId: deleteArticle
      responses:
        '204':
          description: Article deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/ai/draft-article-text:
    parameters:
      - $ref: '#/components/parameters/WorldId'
    post:
      tags: [ai]
      summary: Draft article text from a few keywords/instructions (ADR-0064)
      description: >-
        Prep-time only. Sends the instructions and the editor's current
        content to a cloud LLM (Groq, falling back to OpenRouter) and returns
        a draft the owner edits before saving/printing; nothing is persisted
        server-side. Unavailable (503) if no provider is configured or every
        configured provider fails.
      operationId: draftArticleText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftArticleTextRequest'
      responses:
        '200':
          description: Drafted text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftArticleTextResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /ai/settings:
    get:
      tags: [ai]
      summary: Get the configured AI provider models and fallback priority (ADR-0065)
      description: >-
        Instance-global (no worldId): one setting per provider build supports.
        Returns built-in defaults if nothing has been saved yet.
      operationId: getAiSettings
      responses:
        '200':
          description: Current settings, one entry per provider, in priority order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AiProviderSetting'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [ai]
      summary: Replace the AI provider models and fallback priority (ADR-0065)
      description: >-
        List order becomes the fallback try-order. Takes effect on the very
        next draft request; no restart needed. API keys are not part of this
        endpoint - they stay environment-only (NFR-7).
      operationId: updateAiSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiSettingsUpdateRequest'
      responses:
        '200':
          description: Settings as saved, in the new priority order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AiProviderSetting'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /ai/settings/{providerId}/test:
    post:
      tags: [ai]
      summary: Send a tiny test request to one provider (ADR-0065)
      description: >-
        Diagnostic for the settings UI: asks the provider to complete a
        trivial prompt using its persisted model (or its built-in default).
        A failed test is a normal outcome, reported as data — not a server
        error.
      operationId: testAiProvider
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
            enum: [groq, openrouter]
      responses:
        '200':
          description: The test outcome, successful or not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProviderTestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Bearer token obtained from POST /auth/login. Signed with HS256.

  parameters:
    WorldId:
      name: worldId
      in: path
      required: true
      description: Identifier of the world.
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      description: Identifier of the category.
      schema:
        type: string
        format: uuid
    ArticleId:
      name: articleId
      in: path
      required: true
      description: Identifier of the article.
      schema:
        type: string
        format: uuid
    RevisionId:
      name: revisionId
      in: path
      required: true
      description: Identifier of the article revision.
      schema:
        type: string
        format: uuid
    MediaId:
      name: mediaId
      in: path
      required: true
      description: Identifier of the media asset.
      schema:
        type: string
        format: uuid
    CalendarId:
      name: calendarId
      in: path
      required: true
      description: Identifier of the calendar.
      schema:
        type: string
        format: uuid
    RelationshipId:
      name: relationshipId
      in: path
      required: true
      description: Identifier of the relationship.
      schema:
        type: string
        format: uuid
    CampaignId:
      name: campaignId
      in: path
      required: true
      description: Identifier of the campaign.
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Identifier of the session.
      schema:
        type: string
        format: uuid
    FieldTemplateId:
      name: templateId
      in: path
      required: true
      description: Identifier of the field template.
      schema:
        type: string
        format: uuid
    SheetId:
      name: sheetId
      in: path
      required: true
      description: Identifier of the character sheet.
      schema:
        type: string
        format: uuid
    StatblockId:
      name: statblockId
      in: path
      required: true
      description: Identifier of the statblock.
      schema:
        type: string
        format: uuid
    WhiteboardId:
      name: whiteboardId
      in: path
      required: true
      description: Identifier of the whiteboard.
      schema:
        type: string
        format: uuid
    RollTableId:
      name: tableId
      in: path
      required: true
      description: Identifier of the roll table.
      schema:
        type: string
        format: uuid
    CardDeckId:
      name: deckId
      in: path
      required: true
      description: Identifier of the card deck.
      schema:
        type: string
        format: uuid
    HandoutId:
      name: handoutId
      in: path
      required: true
      description: Identifier of the handout.
      schema:
        type: string
        format: uuid
    ArcId:
      name: arcId
      in: path
      required: true
      description: Identifier of the arc.
      schema:
        type: string
        format: uuid
    BeatId:
      name: beatId
      in: path
      required: true
      description: Identifier of the beat.
      schema:
        type: string
        format: uuid
    TimelineId:
      name: timelineId
      in: path
      required: true
      description: Identifier of the timeline.
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      description: Identifier of the event.
      schema:
        type: string
        format: uuid
    MapId:
      name: mapId
      in: path
      required: true
      description: Identifier of the map.
      schema:
        type: string
        format: uuid
    PinId:
      name: pinId
      in: path
      required: true
      description: Identifier of the pin.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Missing or invalid bearer token / password.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: The requested resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ServiceUnavailable:
      description: >-
        An external dependency (e.g. every configured LLM provider) is
        unavailable; retryable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    DraftArticleTextRequest:
      type: object
      required: [instructions]
      properties:
        instructions:
          type: string
          minLength: 1
          maxLength: 2000
          description: Keywords/instructions for what to draft.
          examples: ["gruff dockmaster, hides a smuggling habit"]
        existingContent:
          type: string
          maxLength: 20000
          description: >-
            The editor's current plain-text/markdown content, sent as context
            so the draft continues rather than contradicts what's already
            written. Empty for a blank article.

    DraftArticleTextResult:
      type: object
      required: [text, provider]
      properties:
        text:
          type: string
          description: Drafted markdown, to insert into the editor for review.
        provider:
          type: string
          description: Which configured provider produced this draft.
          examples: ["groq", "openrouter"]

    AiProviderSetting:
      type: object
      required: [providerId, defaultModel, configured, priority]
      properties:
        providerId:
          type: string
          description: Which build-in provider this setting is for.
          examples: ["groq", "openrouter"]
        model:
          type: string
          nullable: true
          description: >-
            The model to request from this provider. Null means "use
            defaultModel".
        defaultModel:
          type: string
          description: The model used when model is null.
        configured:
          type: boolean
          description: Whether this provider has an API key set (env-only, NFR-7).
        priority:
          type: integer
          description: 0-based fallback try-order; lower is tried first.

    AiProviderTestResult:
      type: object
      required: [ok, model, latencyMs]
      properties:
        ok:
          type: boolean
          description: Whether the provider answered the test request.
        model:
          type: string
          description: The model the request asked for (persisted or default).
        latencyMs:
          type: integer
          description: Round-trip time of the test request in milliseconds.
        error:
          type: string
          nullable: true
          description: Why the test failed; null when ok is true.

    AiSettingsUpdateRequest:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          minItems: 1
          description: List order becomes the new fallback priority order.
          items:
            type: object
            required: [providerId]
            properties:
              providerId:
                type: string
                examples: ["groq", "openrouter"]
              model:
                type: string
                nullable: true
                description: Null to fall back to the provider's default model.

    DiceRollRequest:
      type: object
      required: [expression]
      properties:
        expression:
          type: string
          minLength: 1
          maxLength: 200
          examples: ["2d6+3"]

    DieRoll:
      type: object
      required: [sides, value, kept]
      properties:
        sides:
          type: integer
        value:
          type: integer
        kept:
          type: boolean
          description: False for dice dropped by keep-highest/lowest.

    DiceRollResult:
      type: object
      required: [expression, total, rolls, breakdown]
      properties:
        expression:
          type: string
        total:
          type: integer
        rolls:
          type: array
          items:
            $ref: '#/components/schemas/DieRoll'
        breakdown:
          type: string
          description: Human-readable summary, e.g. "2d6 [4, 5] + 3 = 12".

    TemplateKind:
      type: string
      enum: [CHARACTER, STATBLOCK]
      description: >
        What a field template is for — a character sheet or a monster/NPC
        statblock. Chosen at creation; drives which picker offers the template.

    FieldType:
      type: string
      enum: [TEXT, TEXTAREA, NUMBER, BOOLEAN, SELECT, CIRCLES]

    TemplateField:
      type: object
      required: [key, label, type]
      properties:
        key:
          type: string
          description: Stable identifier used as the key in an instance's values.
        label:
          type: string
        type:
          $ref: '#/components/schemas/FieldType'
        options:
          type: [array, "null"]
          items:
            type: string
          description: Choices for a SELECT field.
        width:
          type: [string, "null"]
          enum: [FULL, HALF, THIRD, QUARTER, null]
          description: Column width for side-by-side layout; defaults to FULL.
        count:
          type: [integer, "null"]
          minimum: 1
          description: Number of circles for a CIRCLES field.

    TemplateSection:
      type: object
      required: [title, fields]
      properties:
        title:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/TemplateField'

    FieldTemplateRequest:
      type: object
      required: [name, kind]
      properties:
