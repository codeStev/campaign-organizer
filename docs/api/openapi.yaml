openapi: 3.1.0
info:
  title: Campaign Organizer API
  version: 0.1.0
  description: >
    Personal worldbuilding and RPG campaign management application.
    This document is the **canonical, design-first contract** for the API.
    Both the Spring Boot backend and the React/TypeScript frontend are expected
    to conform to it (see docs/adr/0008-contract-first-openapi.md).

    Phase 0 covers single-password authentication and the `worlds` resource,
    which is the top-level container every other domain object will hang off of.
  license:
    name: Proprietary (personal use)
  contact:
    name: Campaign Organizer

servers:
  - url: /api
    description: Same-origin API root (frontend proxies /api to the backend)

tags:
  - name: auth
    description: Authentication for the single owner user.
  - name: worlds
    description: Top-level worldbuilding containers.
  - name: categories
    description: Hierarchical grouping of articles within a world.
  - name: articles
    description: Wiki articles within a world.
  - name: templates
    description: Static article template definitions and prompts.
  - name: media
    description: Uploaded images stored on the local volume.
  - name: maps
    description: Interactive maps and their article-linked pins.
  - name: timelines
    description: Timelines and their dated, article-linked events.
  - name: calendars
    description: Custom fantasy calendars with named months.

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Exchange the app password for a bearer token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'

  /worlds:
    get:
      tags: [worlds]
      summary: List all worlds
      operationId: listWorlds
      responses:
        '200':
          description: All worlds owned by the user, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/World'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [worlds]
      summary: Create a world
      operationId: createWorld
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorldRequest'
      responses:
        '201':
          description: World created.
          headers:
            Location:
              description: URI of the created world.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/World'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /worlds/{worldId}:
    parameters:
      - $ref: '#/components/parameters/WorldId'
    get:
      tags: [worlds]
      summary: Get a single world
      operationId: getWorld
      responses:
        '200':
          description: The world.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/World'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [worlds]
      summary: Update a world
      operationId: updateWorld
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorldRequest'
      responses:
        '200':
          description: World updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/World'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [worlds]
      summary: Delete a world
      operationId: deleteWorld
      responses:
        '204':
          description: World deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /article-templates:
    get:
      tags: [templates]
      summary: List article template definitions and their prompts
      operationId: listArticleTemplates
      responses:
        '200':
          description: All template definitions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleTemplateInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /worlds/{worldId}/media:
    parameters:
      - $ref: '#/components/parameters/WorldId'
    get:
      tags: [media]
      summary: List a world's media assets
      operationId: listMedia
      responses:
        '200':
          description: Media assets, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaAsset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [media]
      summary: Upload an image
      operationId: uploadMedia
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Media uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/media/{mediaId}:
    parameters:
      - $ref: '#/components/parameters/WorldId'
      - $ref: '#/components/parameters/MediaId'
    delete:
      tags: [media]
      summary: Delete a media asset
      operationId: deleteMedia
      responses:
        '204':
          description: Media deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /media/{mediaId}/content:
    parameters:
      - $ref: '#/components/parameters/MediaId'
    get:
      tags: [media]
      summary: Serve raw image bytes (public, addressed by unguessable id)
      operationId: getMediaContent
      security: []
      responses:
        '200':
          description: The image bytes.
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/maps:
    parameters:
      - $ref: '#/components/parameters/WorldId'
    get:
      tags: [maps]
      summary: List a world's maps
      operationId: listMaps
      responses:
        '200':
          description: Maps in the world, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Map'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [maps]
      summary: Create a map from an uploaded image
      operationId: createMap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapRequest'
      responses:
        '201':
          description: Map created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Map'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/maps/{mapId}:
    parameters:
      - $ref: '#/components/parameters/WorldId'
      - $ref: '#/components/parameters/MapId'
    get:
      tags: [maps]
      summary: Get a map
      operationId: getMap
      responses:
        '200':
          description: The map.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Map'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [maps]
      summary: Update a map
      operationId: updateMap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapRequest'
      responses:
        '200':
          description: Map updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Map'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [maps]
      summary: Delete a map (and its pins)
      operationId: deleteMap
      responses:
        '204':
          description: Map deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/maps/{mapId}/pins:
    parameters:
      - $ref: '#/components/parameters/WorldId'
      - $ref: '#/components/parameters/MapId'
    get:
      tags: [maps]
      summary: List a map's pins
      operationId: listPins
      responses:
        '200':
          description: Pins on the map.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MapPin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [maps]
      summary: Add a pin to a map
      operationId: createPin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapPinRequest'
      responses:
        '201':
          description: Pin created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapPin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/maps/{mapId}/pins/{pinId}:
    parameters:
      - $ref: '#/components/parameters/WorldId'
      - $ref: '#/components/parameters/MapId'
      - $ref: '#/components/parameters/PinId'
    put:
      tags: [maps]
      summary: Update a pin
      operationId: updatePin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapPinRequest'
      responses:
        '200':
          description: Pin updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapPin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [maps]
      summary: Delete a pin
      operationId: deletePin
      responses:
        '204':
          description: Pin deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/calendars:
    parameters:
      - $ref: '#/components/parameters/WorldId'
    get:
      tags: [calendars]
      summary: List a world's calendars
      operationId: listCalendars
      responses:
        '200':
          description: Calendars in the world, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Calendar'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [calendars]
      summary: Create a calendar
      operationId: createCalendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarRequest'
      responses:
        '201':
          description: Calendar created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/calendars/{calendarId}:
    parameters:
      - $ref: '#/components/parameters/WorldId'
      - $ref: '#/components/parameters/CalendarId'
    put:
      tags: [calendars]
      summary: Update a calendar (replaces its months)
      operationId: updateCalendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarRequest'
      responses:
        '200':
          description: Calendar updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [calendars]
      summary: Delete a calendar
      operationId: deleteCalendar
      responses:
        '204':
          description: Calendar deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/timelines:
    parameters:
      - $ref: '#/components/parameters/WorldId'
    get:
      tags: [timelines]
      summary: List a world's timelines
      operationId: listTimelines
      responses:
        '200':
          description: Timelines in the world, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Timeline'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [timelines]
      summary: Create a timeline
      operationId: createTimeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimelineRequest'
      responses:
        '201':
          description: Timeline created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timeline'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/timelines/{timelineId}:
    parameters:
      - $ref: '#/components/parameters/WorldId'
      - $ref: '#/components/parameters/TimelineId'
    put:
      tags: [timelines]
      summary: Update a timeline
      operationId: updateTimeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimelineRequest'
      responses:
        '200':
          description: Timeline updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timeline'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [timelines]
      summary: Delete a timeline (and its events)
      operationId: deleteTimeline
      responses:
        '204':
          description: Timeline deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/timelines/{timelineId}/events:
    parameters:
      - $ref: '#/components/parameters/WorldId'
      - $ref: '#/components/parameters/TimelineId'
    get:
      tags: [timelines]
      summary: List a timeline's events (chronological)
      operationId: listEvents
      responses:
        '200':
          description: Events ordered by year, month, day.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimelineEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [timelines]
      summary: Add an event to a timeline
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimelineEventRequest'
      responses:
        '201':
          description: Event created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/timelines/{timelineId}/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/WorldId'
      - $ref: '#/components/parameters/TimelineId'
      - $ref: '#/components/parameters/EventId'
    put:
      tags: [timelines]
      summary: Update an event
      operationId: updateEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimelineEventRequest'
      responses:
        '200':
          description: Event updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [timelines]
      summary: Delete an event
      operationId: deleteEvent
      responses:
        '204':
          description: Event deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/categories:
    parameters:
      - $ref: '#/components/parameters/WorldId'
    get:
      tags: [categories]
      summary: List a world's categories
      operationId: listCategories
      responses:
        '200':
          description: Categories in the world, ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [categories]
      summary: Create a category
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Category created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/WorldId'
      - $ref: '#/components/parameters/CategoryId'
    put:
      tags: [categories]
      summary: Update a category
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Category updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [categories]
      summary: Delete a category (its articles are kept, uncategorized)
      operationId: deleteCategory
      responses:
        '204':
          description: Category deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/articles:
    parameters:
      - $ref: '#/components/parameters/WorldId'
    get:
      tags: [articles]
      summary: List a world's articles
      operationId: listArticles
      parameters:
        - name: categoryId
          in: query
          required: false
          description: Filter to a single category.
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: Full-text search query over title and body.
          schema:
            type: string
      responses:
        '200':
          description: Matching articles (summaries), newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [articles]
      summary: Create an article
      operationId: createArticle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleRequest'
      responses:
        '201':
          description: Article created.
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /worlds/{worldId}/articles/{articleId}:
    parameters:
      - $ref: '#/components/parameters/WorldId'
      - $ref: '#/components/parameters/ArticleId'
    get:
      tags: [articles]
      summary: Get a single article
      operationId: getArticle
      responses:
        '200':
          description: The article, with rendered (auto-linked) body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [articles]
      summary: Update an article
      operationId: updateArticle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleRequest'
      responses:
        '200':
          description: Article updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [articles]
      summary: Delete an article
      operationId: deleteArticle
      responses:
        '204':
          description: Article deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Bearer token obtained from POST /auth/login. Signed with HS256.

  parameters:
    WorldId:
      name: worldId
      in: path
      required: true
      description: Identifier of the world.
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      description: Identifier of the category.
      schema:
        type: string
        format: uuid
    ArticleId:
      name: articleId
      in: path
      required: true
      description: Identifier of the article.
      schema:
        type: string
        format: uuid
    MediaId:
      name: mediaId
      in: path
      required: true
      description: Identifier of the media asset.
      schema:
        type: string
        format: uuid
    CalendarId:
      name: calendarId
      in: path
      required: true
      description: Identifier of the calendar.
      schema:
        type: string
        format: uuid
    TimelineId:
      name: timelineId
      in: path
      required: true
      description: Identifier of the timeline.
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      description: Identifier of the event.
      schema:
        type: string
        format: uuid
    MapId:
      name: mapId
      in: path
      required: true
      description: Identifier of the map.
      schema:
        type: string
        format: uuid
    PinId:
      name: pinId
      in: path
      required: true
      description: Identifier of the pin.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Missing or invalid bearer token / password.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: The requested resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    LoginRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          description: The configured application password.
          examples: ["changeme"]

    TokenResponse:
      type: object
      required: [token, tokenType, expiresAt]
      properties:
        token:
          type: string
          description: "Signed JWT to send as `Authorization: Bearer <token>`."
        tokenType:
          type: string
          const: Bearer
        expiresAt:
          type: string
          format: date-time
          description: Expiry instant of the token (UTC).

    WorldRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          examples: ["Aethelgard"]
        description:
          type: string
          maxLength: 5000
          description: Optional summary of the world.

    World:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        parentId:
          type: [string, "null"]
          format: uuid
          description: Parent category for nesting, or null for a root category.

    Category:
      type: object
      required: [id, worldId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        parentId:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ArticleTemplate:
      type: string
      description: The kind of article; drives structured prompts later.
      enum: [GENERIC, CHARACTER, LOCATION, ORGANIZATION, SPECIES, ITEM, EVENT]

    TemplateSection:
      type: object
      required: [heading, hint]
      properties:
        heading:
          type: string
        hint:
          type: string

    ArticleTemplateInfo:
      type: object
      required: [template, label, sections]
      properties:
        template:
          $ref: '#/components/schemas/ArticleTemplate'
        label:
          type: string
        sections:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSection'

    ArticleRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          maxLength: 220
          description: >
            Optional URL-safe identifier, unique per world. Generated from the
            title (and de-duplicated) when omitted.
        template:
          $ref: '#/components/schemas/ArticleTemplate'
        categoryId:
          type: [string, "null"]
          format: uuid
        body:
          type: string
          description: Article body as HTML (see ADR-0013).

    ArticleSummary:
      type: object
      required: [id, worldId, title, slug, template, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        categoryId:
          type: [string, "null"]
          format: uuid
        title:
          type: string
        slug:
          type: string
        template:
          $ref: '#/components/schemas/ArticleTemplate'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Article:
      allOf:
        - $ref: '#/components/schemas/ArticleSummary'
        - type: object
          required: [body]
          properties:
            body:
              type: [string, "null"]
              description: Raw article body as HTML, including `[[target]]` wiki-links.
            bodyHtml:
              type: [string, "null"]
              readOnly: true
              description: >
                Rendered body with wiki-links resolved to anchors (see
                ADR-0014). Read-only; derived from `body`.

    CalendarMonthInput:
      type: object
      required: [name, days]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        days:
          type: integer
          minimum: 1

    CalendarMonth:
      type: object
      required: [name, days]
      properties:
        name:
          type: string
        days:
          type: integer

    CalendarRequest:
      type: object
      required: [name, months]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        daysPerWeek:
          type: [integer, "null"]
          minimum: 1
        months:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CalendarMonthInput'

    Calendar:
      type: object
      required: [id, worldId, name, months, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        name:
          type: string
        daysPerWeek:
          type: [integer, "null"]
        months:
          type: array
          items:
            $ref: '#/components/schemas/CalendarMonth'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TimelineRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 5000
        calendarId:
          type: [string, "null"]
          format: uuid
          description: Optional calendar used to render and validate event dates.

    Timeline:
      type: object
      required: [id, worldId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        calendarId:
          type: [string, "null"]
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TimelineEventRequest:
      type: object
      required: [title, year]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 5000
        articleId:
          type: [string, "null"]
          format: uuid
        year:
          type: integer
          description: Integer year; negative values denote pre-epoch dates.
        month:
          type: [integer, "null"]
          minimum: 1
        day:
          type: [integer, "null"]
          minimum: 1

    TimelineEvent:
      type: object
      required: [id, timelineId, title, year, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        timelineId:
          type: string
          format: uuid
        articleId:
          type: [string, "null"]
          format: uuid
        title:
          type: string
        description:
          type: [string, "null"]
        year:
          type: integer
        month:
          type: [integer, "null"]
        day:
          type: [integer, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MapRequest:
      type: object
      required: [name, mediaId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        mediaId:
          type: string
          format: uuid
          description: The uploaded image used as the map's base layer.

    Map:
      type: object
      required: [id, worldId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        name:
          type: string
        mediaId:
          type: [string, "null"]
          format: uuid
        imageUrl:
          type: [string, "null"]
          description: Public URL of the base image (null if the image was deleted).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MapPinRequest:
      type: object
      required: [x, y]
      properties:
        articleId:
          type: [string, "null"]
          format: uuid
        label:
          type: [string, "null"]
          maxLength: 200
        layer:
          type: [string, "null"]
          maxLength: 100
          description: Optional group used for toggling visibility.
        x:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Horizontal position as a fraction of image width.
        y:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Vertical position as a fraction of image height.

    MapPin:
      type: object
      required: [id, mapId, x, y, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        mapId:
          type: string
          format: uuid
        articleId:
          type: [string, "null"]
          format: uuid
        label:
          type: [string, "null"]
        layer:
          type: [string, "null"]
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MediaAsset:
      type: object
      required: [id, worldId, filename, contentType, size, url, createdAt]
      properties:
        id:
          type: string
          format: uuid
        worldId:
          type: string
          format: uuid
        filename:
          type: string
        contentType:
          type: string
        size:
          type: integer
          format: int64
        url:
          type: string
          description: Public URL serving the bytes.
        createdAt:
          type: string
          format: date-time

    ProblemDetail:
      type: object
      description: RFC 9457 / RFC 7807 problem response.
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

security:
  - bearerAuth: []
