server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend service (same-origin from the browser).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite content-hashes every filename under /assets/ (a new build never
    # reuses an old name), so these are safe to cache indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: serve index.html for client-side routes. Without an
    # explicit no-cache here, a response with only Last-Modified/ETag (no
    # Cache-Control) is fair game for the browser's own heuristic caching -
    # confirmed live during this session: a hard-refreshed tab kept loading
    # an old build's /assets/index-*.css by filename, from a stale cached
    # index.html, well after a fresh image had been deployed.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
